<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 255" font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><rect width="600" height="255" fill="#fff"/>
<g><path d="M60 50 v130 h100 v-130" fill="none" stroke="#333" stroke-width="2"/><rect x="61" y="80" width="98" height="99" fill="#d6eaf8"/><text x="110" y="35" text-anchor="middle" font-size="18" font-weight="700">甲</text><text x="110" y="205" text-anchor="middle" font-size="15">全溶、還能再溶</text><text x="110" y="224" text-anchor="middle" font-size="15" fill="#1f5fa8">未飽和</text></g>
<g transform="translate(190,0)"><path d="M60 50 v130 h100 v-130" fill="none" stroke="#333" stroke-width="2"/><rect x="61" y="80" width="98" height="99" fill="#aed6f1"/><rect x="61" y="170" width="98" height="9" fill="#fbfcfc" stroke="#999"/><text x="110" y="35" text-anchor="middle" font-size="18" font-weight="700">乙</text><text x="110" y="205" text-anchor="middle" font-size="15">少量沉澱</text><text x="110" y="224" text-anchor="middle" font-size="15" fill="#c0392b">飽和</text></g>
<g transform="translate(380,0)"><path d="M60 50 v130 h100 v-130" fill="none" stroke="#333" stroke-width="2"/><rect x="61" y="80" width="98" height="99" fill="#aed6f1"/><rect x="61" y="150" width="98" height="29" fill="#fbfcfc" stroke="#999"/><text x="110" y="35" text-anchor="middle" font-size="18" font-weight="700">丙</text><text x="110" y="205" text-anchor="middle" font-size="15">大量沉澱</text><text x="110" y="224" text-anchor="middle" font-size="15" fill="#c0392b">飽和</text></g>
<text x="400" y="120" text-anchor="middle" font-size="16" font-weight="700">乙 ＝ 丙</text><text x="300" y="250" text-anchor="middle" font-size="15" fill="#555">同溫下飽和溶液濃度相同：乙＝丙＞甲</text></svg>
