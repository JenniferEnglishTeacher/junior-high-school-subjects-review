<g font-size="16" text-anchor="middle" fill="#3a2a17"><text x="200" y="325">明初</text><text x="340" y="325">明末</text><text x="460" y="325">清初</text></g>
<g stroke="#9a6b35" stroke-dasharray="4 4"><line x1="200" y1="270" x2="200" y2="300"/><line x1="460" y1="270" x2="460" y2="300"/></g>
<text x="200" y="293" font-size="13" fill="#c0392b" text-anchor="middle">衰落①</text><text x="460" y="293" font-size="13" fill="#c0392b" text-anchor="middle">衰落②</text>
</svg>
