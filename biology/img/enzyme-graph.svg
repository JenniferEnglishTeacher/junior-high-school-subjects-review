<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="蛋白質濃度隨時間變化圖" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#17313a"/></marker></defs>
<rect width="600" height="360" fill="#fffdf8"/>
<line x1="80" y1="290" x2="560" y2="290" stroke="#17313a" stroke-width="2" marker-end="url(#a)"/>
<line x1="80" y1="290" x2="80" y2="30" stroke="#17313a" stroke-width="2" marker-end="url(#a)"/>
<text x="70" y="40" text-anchor="end" font-size="16">濃度</text><text x="70" y="70" text-anchor="end" font-size="15">高</text><text x="70" y="280" text-anchor="end" font-size="15">低</text>
<g font-size="15" text-anchor="middle"><text x="80" y="312">0</text><text x="140" y="312">5</text><text x="200" y="312">10</text><text x="260" y="312">15</text><text x="320" y="312">20</text><text x="380" y="312">25</text><text x="440" y="312">30</text><text x="500" y="312">35</text></g>
<text x="555" y="335" text-anchor="end" font-size="15">時間(分)</text>
<polyline fill="none" stroke="#0b6b57" stroke-width="3" points="104,70 140,88 200,130 260,170 320,205 380,232 440,232 500,232"/>
<g fill="#0b6b57"><circle cx="104" cy="70" r="5"/><circle cx="140" cy="88" r="5"/><circle cx="200" cy="130" r="5"/><circle cx="260" cy="170" r="5"/><circle cx="320" cy="205" r="5"/><circle cx="380" cy="232" r="5"/><circle cx="440" cy="232" r="5"/><circle cx="500" cy="232" r="5"/></g>
<text x="300" y="352" text-anchor="middle" font-size="15" fill="#61727a">圖(十)　蛋白質濃度的變化（依原題示意圖重繪）</text>
</svg>
