<script type="application/json" id="bank">{"id": "yunwen", "title": "韻文常識", "eyebrow": "語文常識 · 單元 2", "intro": "詩經、楚辭、賦、樂府、古體詩、近體詩、詞、曲的特色與格律。", "sections": [{"id": "early", "title": "詩經・楚辭・賦・樂府・古體詩", "items": [{"stem": "中國最早的詩歌總集、被稱為「韻文之祖」的是哪一部作品？", "opts": ["楚辭", "詩經", "樂府詩集", "全唐詩"], "ans": 1, "exp": "詩經收西周初到春秋中葉黃河流域的民歌與宗廟樂章，是最早的詩歌總集、韻文之祖，也是北方文學代表。", "src": ""}, {"stem": "楚辭的代表作家是誰？", "opts": ["孔子", "屈原", "司馬遷", "李白"], "ans": 1, "exp": "楚辭是戰國時楚國的詩歌，西漢劉向編成書，以屈原作品為主，代表作〈離騷〉。", "src": ""}, {"stem": "「離騷」的意思是什麼？", "opts": ["離開故鄉的憂愁", "遭受憂愁", "離別的歌謠", "騷人墨客"], "ans": 1, "exp": "離＝遭受，騷＝憂愁。屈原被楚懷王貶逐，作〈離騷〉抒發憂憤。", "src": ""}, {"stem": "「介於詩與文之間，鋪陳辭藻，寫景敘事」，是漢代文學主流的文體是？", "opts": ["樂府", "賦", "駢文", "古體詩"], "ans": 1, "exp": "賦介於詩與散文之間，講究鋪陳，是漢代文學主流；楚辭與漢賦合稱「辭賦」。", "src": ""}, {"stem": "「樂府」原本是什麼？", "opts": ["唐代詩人的別號", "漢武帝設立的音樂官署", "宋代詞的總集", "元代的戲曲劇團"], "ans": 1, "exp": "漢武帝設立樂府官署，採集民間歌謠配樂演唱；後來樂府採集的詩歌就稱為樂府詩。", "src": ""}, {"stem": "下列哪一項不是樂府詩的特色？", "opts": ["可以合樂演唱", "句數字數不限", "一定要對仗", "可以轉韻"], "ans": 2, "exp": "樂府詩句數字數不限、要押韻可轉韻、不必對仗。", "src": ""}, {"stem": "下列哪一首是北朝民歌樂府？", "opts": ["敕勒歌", "登鸛雀樓", "靜夜思", "江雪"], "ans": 0, "exp": "〈敕勒歌〉（天蒼蒼，野茫茫）是北朝民歌，屬樂府；其他三首是唐代近體詩。", "src": ""}, {"stem": "關於古體詩，下列敘述何者正確？", "opts": ["只能寫五言", "可以轉韻", "一定要八句", "起源於唐代"], "ans": 1, "exp": "古體詩創始於漢，有五言、七言、雜言，句數不限，可以轉韻；「古詩」之名是唐人為區別近體詩而起。", "src": ""}], "ref": "<div class=\"table-wrap\"><table><tr><th>文體<\/th><th>時代<\/th><th>重點<\/th><\/tr><tr><td>詩經<\/td><td>西周初～春秋中葉<\/td><td>最早詩歌總集、韻文之祖、北方文學代表；孔子刪修<\/td><\/tr><tr><td>楚辭<\/td><td>戰國<\/td><td>南方文學代表；劉向編，以屈原作品為主（〈離騷〉）<\/td><\/tr><tr><td>賦<\/td><td>漢<\/td><td>介於詩與文之間，鋪陳辭藻；楚辭＋漢賦＝辭賦<\/td><\/tr><tr><td>樂府詩<\/td><td>兩漢～南北朝<\/td><td>樂府官署採集的民歌；可唱、句數字數不限、可轉韻、不必對仗<\/td><\/tr><tr><td>古體詩<\/td><td>創始於漢<\/td><td>五言、七言、雜言；句數不限、可轉韻；只可誦不可歌<\/td><\/tr><\/table><\/div>"}, {"id": "jinti", "title": "近體詩格律", "items": [{"stem": "「近體詩」是哪一個朝代興起的新詩體？", "opts": ["漢", "魏晉", "唐", "宋"], "ans": 2, "exp": "近體詩（今體詩）是唐代新興的詩體，分絕句與律詩，格律嚴謹。", "src": ""}, {"stem": "一首律詩共有幾句？", "opts": ["四句", "六句", "八句", "不限"], "ans": 2, "exp": "絕句四句，律詩八句（首聯、頷聯、頸聯、尾聯）。", "src": ""}, {"stem": "律詩規定哪兩聯一定要對仗？", "opts": ["首聯、尾聯", "頷聯、頸聯", "首聯、頷聯", "頸聯、尾聯"], "ans": 1, "exp": "律詩第二、三聯（頷聯、頸聯）必須對仗。", "src": ""}, {"stem": "絕句的押韻規定，何者正確？", "opts": ["每一句都要押韻", "第三句一定要押韻", "二、四句必押，第三句不可押", "可以中途換韻"], "ans": 2, "exp": "絕句二、四句必押，首句可押可不押，第三句不可押；近體詩一韻到底不可換韻。", "src": ""}, {"stem": "近體詩判斷「平起」或「仄起」，要看哪一個字？", "opts": ["首句第一字", "首句第二字", "首句最後一字", "第二句第二字"], "ans": 1, "exp": "看首句第二字：平聲為平起式，仄聲為仄起式。", "src": ""}, {"stem": "「一三五不論，二四六分明」說的是近體詩的什麼規則？", "opts": ["押韻", "對仗", "平仄", "句數"], "ans": 2, "exp": "這是平仄口訣：七言詩第一、三、五字平仄較自由，第二、四、六字必須合律。", "src": ""}, {"stem": "國語中沒有，需要用閩南語等方言判斷的古代聲調是？", "opts": ["平聲", "上聲", "去聲", "入聲"], "ans": 3, "exp": "入聲字發音短促，國語已無入聲，如白、竹、得、獨、福、出等字，國語念平聲但古代屬仄聲。", "src": ""}, {"stem": "下列哪一個字在古代屬於「仄聲」？", "opts": ["光", "前", "竹", "鄉"], "ans": 2, "exp": "「竹」是入聲字，屬仄聲；光、前、鄉都是平聲。", "src": ""}, {"stem": "近體詩第二、三句平仄相同，稱為什麼？", "opts": ["黏", "失黏", "對仗", "轉韻"], "ans": 0, "exp": "第二、三句平仄相同稱「黏」，不同則稱「失黏」。", "src": ""}], "ref": "<div class=\"table-wrap\"><table><tr><th>體制<\/th><th>絕句<\/th><th>律詩<\/th><\/tr><tr><td>句數<\/td><td>4 句<\/td><td>8 句<\/td><\/tr><tr><td>押韻<\/td><td>二、四句必押，首句可押，第三句不可押<\/td><td>二、四、六、八句必押，首句可押<\/td><\/tr><tr><td>換韻<\/td><td>一韻到底<\/td><td>一韻到底<\/td><\/tr><tr><td>對仗<\/td><td>不必<\/td><td>頷聯、頸聯必對<\/td><\/tr><tr><td>平仄<\/td><td>固定<\/td><td>固定<\/td><\/tr><\/table><\/div><div class=\"table-wrap\"><table><tr><th>古音<\/th><th>古四聲<\/th><th>國語<\/th><\/tr><tr><td>平<\/td><td>平<\/td><td>一、二聲<\/td><\/tr><tr><td>仄<\/td><td>上<\/td><td>三聲<\/td><\/tr><tr><td>仄<\/td><td>去<\/td><td>四聲<\/td><\/tr><tr><td>仄<\/td><td>入<\/td><td>國語無（白、竹、得、獨、福、出……）<\/td><\/tr><\/table><\/div><p>首句第二字平→平起式，仄→仄起式。口訣：一三五不論，二四六分明。<\/p>"}, {"id": "ciqu", "title": "詞與曲", "items": [{"stem": "「詞」又稱「長短句」，原因是什麼？", "opts": ["產生在詩之後", "句子長短不齊", "可以依詞牌填寫", "可以合樂歌唱"], "ans": 1, "exp": "詞的句子長短不一，有別於句式整齊的近體詩，所以稱長短句，如辛棄疾《稼軒長短句》。", "src": ""}, {"stem": "詞又稱為「詩餘」，是因為？", "opts": ["在詩之後產生", "字數比詩多", "用韻比詩寬", "可以唱"], "ans": 0, "exp": "詞產生在詩之後，被視為詩的餘緒，故稱詩餘，如《草堂詩餘》。", "src": ""}, {"stem": "依《草堂詩餘》的分法，91 字以上的詞稱為？", "opts": ["小令", "中調", "長調", "散套"], "ans": 2, "exp": "小令 58 字以內，中調 59～90 字，長調（慢詞）91 字以上。", "src": ""}, {"stem": "岳飛〈滿江紅〉共 93 字，屬於哪一類詞？", "opts": ["小令", "中調", "長調", "散曲"], "ans": 2, "exp": "91 字以上屬長調，〈滿江紅〉93 字。", "src": ""}, {"stem": "詞的計算單位是什麼？", "opts": ["首", "闋", "折", "套"], "ans": 1, "exp": "詞以「闋」計算，分段稱上闋、下闋（上片、下片）。", "src": ""}, {"stem": "詞牌名與詞的內容相符，稱為什麼？", "opts": ["緣題作賦", "託物言志", "鼎足對", "倚聲填詞"], "ans": 0, "exp": "詞牌通常與內容無關；若依詞牌名寫內容，稱「緣題作賦」，如李珣〈南鄉子〉寫江南水鄉。", "src": ""}, {"stem": "下列哪一個是「曲」的別稱？", "opts": ["詩餘", "詞餘", "長短句", "倚聲"], "ans": 1, "exp": "曲在詞之後產生，又稱「詞餘」，如吳梅《詞餘講義》；詩餘、長短句、倚聲是詞的別稱。", "src": ""}, {"stem": "元雜劇的「科」指的是什麼？", "opts": ["歌詞", "動作", "說白", "道具"], "ans": 1, "exp": "雜劇由曲（歌詞）、科（動作）、白（說白）組成。", "src": ""}, {"stem": "關於元曲的押韻，何者正確？", "opts": ["可以中途轉韻", "沒有入聲，平上去可通押", "一定押仄聲韻", "不必押韻"], "ans": 1, "exp": "元曲無入聲，平、上、去聲可以通押，而且一韻到底不能轉韻。", "src": ""}, {"stem": "在曲牌規定字數之外添加的字，稱為什麼？", "opts": ["襯字", "韻腳", "詩眼", "對句"], "ans": 0, "exp": "襯字使語意流暢生動，只加在句首或句中，不加句末，且不宜太多。", "src": ""}, {"stem": "三句互相對仗，是元曲特有的什麼對？", "opts": ["流水對", "鼎足對", "當句對", "隔句對"], "ans": 1, "exp": "三句相對稱「鼎足對」，是元曲特有的對仗形式。", "src": ""}, {"stem": "馬致遠〈天淨沙·秋思〉中，「天淨沙」是什麼？", "opts": ["題目", "曲牌", "作者別號", "宮調"], "ans": 1, "exp": "「天淨沙」是曲牌，只標明音樂性；「秋思」才是與內容有關的題目。", "src": ""}, {"stem": "散曲中，由同一宮調的數支曲牌組成一套、一韻到底的是？", "opts": ["小令", "散套", "雜劇", "長調"], "ans": 1, "exp": "散套（套數、套曲）由同一宮調的數支曲牌組成；小令是單支曲牌。", "src": ""}], "ref": "<div class=\"table-wrap\"><table><tr><th>項目<\/th><th>詞<\/th><th>曲<\/th><\/tr><tr><td>別稱<\/td><td>曲子詞、倚聲、樂府、長短句、詩餘<\/td><td>詞餘、樂府<\/td><\/tr><tr><td>分類<\/td><td>小令（≦58字）、中調（59–90）、長調（≧91）<\/td><td>散曲（小令、散套）、雜劇（曲、科、白）<\/td><\/tr><tr><td>格律<\/td><td>依詞牌，有些可轉韻<\/td><td>依曲牌，一韻到底；無入聲，平上去通押<\/td><\/tr><tr><td>特色<\/td><td>單位「闋」；緣題作賦<\/td><td>口語化、襯字、鼎足對<\/td><\/tr><\/table><\/div>"}]}</script>
