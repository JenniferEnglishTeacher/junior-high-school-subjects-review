<script type="application/json" id="bank">{"id": "suyanyu", "title": "俗諺語", "eyebrow": "語文常識 · 單元 7", "sections": [{"id": "guoyu", "title": "國語俗諺 → 意思相近的成語", "items": [{"stem": "「畫虎不成反類犬」意思相近的成語是？", "opts": ["東施效顰", "杯弓蛇影", "眾口鑠金", "害群之馬"], "ans": 0, "exp": "想學畫老虎卻畫得像狗，比喻模仿不成反而弄巧成拙；東施模仿西施皺眉，反而更醜，意思相同。", "src": "課本 p.91 一-1"}, {"stem": "「螳螂捕蟬，黃雀在後」意思相近的成語是？", "opts": ["熟能生巧", "過河拆橋", "一丘之貉", "短視近利"], "ans": 3, "exp": "螳螂只顧眼前的蟬，沒發現背後的黃雀，比喻只貪眼前小利而不顧後患＝短視近利。", "src": "課本 p.91 一-2"}, {"stem": "「一山不容二虎」意思相近的成語是？", "opts": ["勢不兩立", "答非所問", "害群之馬", "東施效顰"], "ans": 0, "exp": "兩隻老虎不能共處一山，比喻雙方對立、無法並存＝勢不兩立。", "src": "課本 p.91 一-3"}, {"stem": "「牛頭不對馬嘴」意思相近的成語是？", "opts": ["答非所問", "得不償失", "杯弓蛇影", "勢不兩立"], "ans": 0, "exp": "比喻回答與問題、或前後內容兜不攏＝答非所問。", "src": "課本 p.91 一-4"}, {"stem": "「一人傳虛，萬人傳實」意思相近的成語是？", "opts": ["一丘之貉", "眾口鑠金", "禍不單行", "熟能生巧"], "ans": 1, "exp": "假話被眾人一再傳播就變成真的；眾口鑠金＝眾人的言論足以熔化金屬，指輿論力量大、能混淆是非。", "src": "課本 p.91 一-5"}, {"stem": "「一朝被蛇咬，十年怕草繩」意思相近的成語是？", "opts": ["害群之馬", "禍不單行", "杯弓蛇影", "熟能生巧"], "ans": 2, "exp": "受過驚嚇後疑神疑鬼、看到相似的東西就害怕＝杯弓蛇影（把杯中弓影當成蛇）。", "src": "課本 p.91 一-6"}, {"stem": "「屋漏偏逢連夜雨」意思相近的成語是？", "opts": ["禍不單行", "短視近利", "眾口鑠金", "害群之馬"], "ans": 0, "exp": "屋子漏水又碰上連夜大雨，比喻倒楣的事接連發生＝禍不單行。", "src": "課本 p.91 一-7"}, {"stem": "「圖他一斗米，失卻半年糧」意思相近的成語是？", "opts": ["過河拆橋", "禍不單行", "杯弓蛇影", "因小失大"], "ans": 3, "exp": "為了貪一斗米，反而失去半年的糧食＝因小失大。", "src": "課本 p.91 一-8"}, {"stem": "「偷雞不著蝕把米」意思相近的成語是？", "opts": ["得不償失", "禍不單行", "害群之馬", "貪得無厭"], "ans": 0, "exp": "雞沒偷到，反而賠掉引雞用的米，所得抵不過損失＝得不償失。", "src": "課本 p.91 一-9"}, {"stem": "「一粒老鼠屎，壞了一鍋粥」意思相近的成語是？", "opts": ["害群之馬", "得不償失", "熟能生巧", "杯弓蛇影"], "ans": 0, "exp": "一個壞分子破壞整個團體＝害群之馬。", "src": "課本 p.91 一-10"}, {"stem": "「天下烏鴉一般黑」意思相近的成語是？", "opts": ["杯弓蛇影", "東施效顰", "害群之馬", "一丘之貉"], "ans": 3, "exp": "比喻同類的壞人都一樣壞＝一丘之貉（同一山丘上的貉，沒有差別）。", "src": "課本 p.91 一-11"}, {"stem": "「人心不足蛇吞象」意思相近的成語是？", "opts": ["勢不兩立", "東施效顰", "貪得無厭", "杯弓蛇影"], "ans": 2, "exp": "人心貪婪就像蛇想吞下大象＝貪得無厭。", "src": "課本 p.91 一-12"}, {"stem": "「一回生，二回熟，事經三回腦中留」意思相近的成語是？", "opts": ["熟能生巧", "禍不單行", "害群之馬", "答非所問"], "ans": 0, "exp": "做得越多次就越熟練＝熟能生巧。", "src": "課本 p.91 一-13"}, {"stem": "「新娘進了房，媒人扔過牆」意思相近的成語是？", "opts": ["杯弓蛇影", "一丘之貉", "因小失大", "過河拆橋"], "ans": 3, "exp": "事情成功後就把幫忙的人一腳踢開＝過河拆橋。", "src": "課本 p.91 一-14"}], "ref": "<p>作答技巧：先把諺語「翻成白話」，再找意思相同的成語。例：屋漏＋連夜雨＝壞事接連來＝禍不單行。<\/p>"}, {"id": "tianchong", "title": "諺語填充", "items": [{"stem": "世風日下，人心不古，有些人看起來斯斯文文，卻是無惡不作，可謂（　）", "opts": ["馬不知臉長", "畫虎畫皮難畫骨，知人知面不知心", "死馬當活馬醫", "一根腸子通到底"], "ans": 1, "exp": "外表斯文、內心兇惡，看得到外表看不到內心＝畫虎畫皮難畫骨，知人知面不知心。", "src": "課本 p.92 二-1"}, {"stem": "自從他成了家喻戶曉的大明星之後，狗仔隊就時時刻刻跟拍他的一舉一動，一些流言蜚語也開始不脛而走，果真是（　）啊！", "opts": ["又要馬兒好，又要馬兒不吃草", "人怕出名豬怕肥", "馬不知臉長", "死馬當活馬醫"], "ans": 1, "exp": "人出了名就惹來麻煩，就像豬養肥了就要被宰＝人怕出名豬怕肥。", "src": "課本 p.92 二-2"}, {"stem": "一般消費大眾，又想享受高品質的服務，又不能忍受收費調漲，這不是（　）嗎？", "opts": ["畫虎畫皮難畫骨，知人知面不知心", "一根腸子通到底", "只見樹木不見林", "又要馬兒好，又要馬兒不吃草"], "ans": 3, "exp": "既要求品質好又不願付出代價＝又要馬兒好，又要馬兒不吃草。", "src": "課本 p.92 二-3"}, {"stem": "你連這麼基本的問題都回答不出來，還好意思說自己的文學造詣很高，真是（　）！", "opts": ["馬不知臉長", "肥水不落外人田", "死馬當活馬醫", "畫虎畫皮難畫骨，知人知面不知心"], "ans": 0, "exp": "不知道自己的缺點、沒有自知之明＝馬不知臉長。", "src": "課本 p.92 二-4"}, {"stem": "你別難過了，這個社會本來就是（　），別指望所有人的想法都和你一樣，自己有信心最重要。", "opts": ["一樣米養百樣人", "馬不知臉長", "只見樹木不見林", "死馬當活馬醫"], "ans": 0, "exp": "同樣的米養出各式各樣的人，指人各有不同＝一樣米養百樣人。", "src": "課本 p.92 二-5"}, {"stem": "俗話說：「（　）。」這個獲利豐厚的生意，當然要找自家人來經營囉！", "opts": ["死馬當活馬醫", "畫虎畫皮難畫骨，知人知面不知心", "肥水不落外人田", "薑是老的辣"], "ans": 2, "exp": "好處要留給自己人＝肥水不落外人田。", "src": "課本 p.92 二-6"}, {"stem": "許多政策的制定（　），缺乏通盤的考量，難怪推行後百姓怨聲載道。", "opts": ["只見樹木不見林", "薑是老的辣", "一樣米養百樣人", "馬不知臉長"], "ans": 0, "exp": "只看局部、不見整體＝只見樹木不見林，與「缺乏通盤考量」呼應。", "src": "課本 p.92 二-7"}, {"stem": "就照你的方法做吧！到了這種地步，也只能（　）了。", "opts": ["薑是老的辣", "死馬當活馬醫", "人怕出名豬怕肥", "又要馬兒好，又要馬兒不吃草"], "ans": 1, "exp": "已經沒有辦法，只好姑且一試＝死馬當活馬醫。（照片中 (D) 選項文字被遮住，依題意與常見諺語判定。）", "src": "課本 p.92 二-8"}, {"stem": "果然（　）！這位資深記者的訪談技巧，比初出茅廬的新手高明太多了。", "opts": ["畫虎畫皮難畫骨，知人知面不知心", "只見樹木不見林", "一樣米養百樣人", "薑是老的辣"], "ans": 3, "exp": "年紀大、經驗多的人比較老練＝薑是老的辣，與「資深 vs. 新手」呼應。", "src": "課本 p.92 二-9"}, {"stem": "他是個（　）的人，有什麼便說什麼，一點也不懂得拐彎抹角。", "opts": ["人怕出名豬怕肥", "一根腸子通到底", "又要馬兒好，又要馬兒不吃草", "薑是老的辣"], "ans": 1, "exp": "個性直爽、有話直說＝一根腸子通到底（直腸子）。", "src": "課本 p.92 二-10"}]}, {"id": "minyu", "title": "閩語諺語 → 適當的成語", "items": [{"stem": "閩語諺語「頭仔興興，尾仔冷冷（做事剛開始特別帶勁，過一段時間便鬆懈）」，應填哪個成語？", "opts": ["虎頭蛇尾", "虛情假意", "外強中乾", "袖手旁觀"], "ans": 0, "exp": "開頭熱烈、後來冷淡＝虎頭蛇尾。", "src": "課本 p.93 一-1"}, {"stem": "閩語諺語「徛高樓，看馬相踢（隔山觀虎鬥，既不危險又與自己無關）」，應填哪個成語？", "opts": ["深藏不露", "喧賓奪主", "虎頭蛇尾", "袖手旁觀"], "ans": 3, "exp": "站在高樓上看馬互踢，置身事外＝袖手旁觀。", "src": "課本 p.93 一-2"}, {"stem": "閩語諺語「草蜢弄雞公（弱者不自量力，向強者挑釁，自取滅亡）」，應填哪個成語？", "opts": ["虎頭蛇尾", "虛情假意", "外強中乾", "螳臂當車"], "ans": 3, "exp": "蚱蜢去逗公雞，自找死路＝螳臂當車。", "src": "課本 p.93 一-3"}, {"stem": "閩語諺語「無話講茄荎（形容人廢話連篇）」，應填哪個成語？", "opts": ["言不及義", "未雨綢繆", "螳臂當車", "外強中乾"], "ans": 0, "exp": "沒話找話、說的都是沒意義的話＝言不及義。", "src": "課本 p.93 一-4"}, {"stem": "閩語諺語「講話沒關後尾門（說話不知謹慎，因此惹來禍端）」，應填哪個成語？", "opts": ["未雨綢繆", "虛情假意", "外強中乾", "口無遮攔"], "ans": 3, "exp": "說話像沒關後門一樣＝口無遮攔。", "src": "課本 p.93 一-5"}, {"stem": "閩語諺語「乞丐趕廟公（變被動為主動、變次要為主要）」，應填哪個成語？", "opts": ["袖手旁觀", "喧賓奪主", "未雨綢繆", "螳臂當車"], "ans": 1, "exp": "借住廟裡的乞丐反把廟公趕走＝喧賓奪主。", "src": "課本 p.93 一-6"}, {"stem": "閩語諺語「大個，好看頭（外表有派頭，實際體質不佳）」，應填哪個成語？", "opts": ["袖手旁觀", "外強中乾", "虛情假意", "未雨綢繆"], "ans": 1, "exp": "外表強壯、內裡虛弱＝外強中乾。", "src": "課本 p.93 一-7"}, {"stem": "閩語諺語「烏矸仔貯豆油，看不出來（本事令人看不透，往往出人意料）」，應填哪個成語？", "opts": ["喧賓奪主", "虛情假意", "深藏不露", "言不及義"], "ans": 2, "exp": "黑瓶子裝醬油，看不出裡面有多少＝深藏不露。", "src": "課本 p.93 一-8"}, {"stem": "閩語諺語「六月芥菜假有心（從外表看不出芥菜有心無心）」，應填哪個成語？", "opts": ["未雨綢繆", "袖手旁觀", "虛情假意", "口無遮攔"], "ans": 2, "exp": "「假有心」＝裝作有心意＝虛情假意。", "src": "課本 p.93 一-9"}, {"stem": "閩語諺語「好天，著存雨來糧（平時就要懂得儲蓄，以備不時之需）」，應填哪個成語？", "opts": ["虎頭蛇尾", "深藏不露", "虛情假意", "未雨綢繆"], "ans": 3, "exp": "晴天就要先存好下雨天的糧食＝未雨綢繆。", "src": "課本 p.93 一-10"}]}, {"id": "minguo", "title": "閩語 → 國語諺語", "items": [{"stem": "閩語諺語「少年不會想，吃老不成樣（勉人把握時光，及時努力）」，意思相近的國語諺語：（　）不努力，（　）徒傷悲。", "opts": ["年少／中年", "青春／白頭", "少年／老年", "少壯／老大"], "ans": 3, "exp": "出自漢樂府〈長歌行〉：「少壯不努力，老大徒傷悲。」", "src": "課本 p.93 二-1"}, {"stem": "閩語諺語「一人一家代，公媽隨人拜（勸人不要多管閒事）」，意思相近的國語諺語：各人自掃（　），莫管他人（　）。", "opts": ["庭前葉／瓦上雪", "門前地／屋上瓦", "屋前雪／牆上霜", "門前雪／瓦上霜"], "ans": 3, "exp": "各人自掃門前雪，莫管他人瓦上霜：只管好自己的事。", "src": "課本 p.93 二-2"}, {"stem": "閩語諺語「惡馬惡人騎（再壞的人，也會有剋星來制住他）」，意思相近的國語諺語：一物（　）一物。", "opts": ["換", "剋", "生", "比"], "ans": 1, "exp": "一物剋一物（也作一物降一物）：任何事物都有能制服它的剋星。", "src": "課本 p.94 二-3"}, {"stem": "閩語諺語「人在做，天在看（人的言行舉動，老天爺都看在眼裡）」，意思相近的國語諺語：舉頭三尺有（　）。", "opts": ["天眼", "青天", "神明", "明月"], "ans": 2, "exp": "舉頭三尺有神明：勸人不要做虧心事。", "src": "課本 p.94 二-4"}, {"stem": "閩語諺語「千算萬算，毋值天一畫（再怎麼籌畫，也比不上老天爺一筆）」，意思相近的國語諺語：（　）在人，（　）在天。", "opts": ["算計／結果", "努力／成功", "做事／成敗", "謀事／成事"], "ans": 3, "exp": "謀事在人，成事在天：人可以盡力籌畫，成敗則由天決定。", "src": "課本 p.94 二-5"}, {"stem": "閩語諺語「日頭赤炎炎，隨人顧性命（凡事只為自己，不顧他人）」，意思相近的國語諺語：人不（　），天誅地滅。", "opts": ["為人", "自私", "為己", "顧己"], "ans": 2, "exp": "人不為己，天誅地滅：形容自私自利、只顧自己。", "src": "課本 p.94 二-6"}, {"stem": "閩語諺語「雙手抱孩兒，才知父母時（抱著自己的孩子才體會父母心）」，意思相近的國語諺語：養兒方知（　）恩。", "opts": ["父母", "天地", "師長", "祖先"], "ans": 0, "exp": "養兒方知父母恩：自己當了父母，才懂父母養育的辛苦。", "src": "課本 p.94 二-7"}, {"stem": "閩語諺語「牛就是牛，牽到北京也是牛（個性不易改變）」，意思相近的國語諺語：（　）易改，（　）難移。", "opts": ["江山／本性", "容貌／脾氣", "山河／性情", "江河／天性"], "ans": 0, "exp": "江山易改，本性難移：山河容易改變，人的本性很難改。", "src": "課本 p.94 二-8"}, {"stem": "閩語諺語「甘蔗，無雙頭甜（比喻事物沒辦法兩全其美）」，意思相近的國語諺語：（　）與（　）不可兼得。", "opts": ["魚／熊掌", "江山／美人", "魚／龍蝦", "名／利"], "ans": 0, "exp": "出自《孟子》：「魚，我所欲也；熊掌，亦我所欲也；二者不可得兼。」", "src": "課本 p.94 二-9"}, {"stem": "閩語諺語「甘願得失頭前，不可得失後壁（寧可事前談清楚）」，意思相近的國語諺語：先（　），後（　）。", "opts": ["禮後／兵", "說清／翻臉", "君子／小人", "小人／君子"], "ans": 3, "exp": "先小人，後君子：事前先把條件講明，免得事後翻臉。", "src": "課本 p.94 二-10"}, {"stem": "閩語諺語「打虎掠賊親兄弟（辦事情須用親信的人）」，意思相近的國語諺語：打虎（　），上陣（　）兵。", "opts": ["好朋友／子弟", "兄弟兵／父母", "親兄弟／父子", "親兄弟／兄弟"], "ans": 2, "exp": "打虎親兄弟，上陣父子兵：危險的事要靠最親的人。", "src": "課本 p.94 二-11"}, {"stem": "閩語諺語「食四面風，講五色話（善於適應環境，迎合時勢）」，意思相近的國語諺語：見人說（　）話，見鬼說（　）話。", "opts": ["大／小", "人／鬼", "好／壞", "真／假"], "ans": 1, "exp": "見人說人話，見鬼說鬼話：看對象說好聽話、八面玲瓏。", "src": "課本 p.94 二-12"}, {"stem": "閩語諺語「啞口乎蜂叮著（很痛卻叫不出來）」，意思相近的國語諺語：啞巴吃（　），有（　）說不出。", "opts": ["黃蓮／苦", "苦瓜／口", "黃連／口", "黃連／苦"], "ans": 3, "exp": "黃連是味道極苦的中藥材，正字是「黃連」，不是「黃蓮」。", "src": "課本 p.94 二-13"}, {"stem": "閩語諺語「吃快撞破碗（做事要考慮周詳、按部就班）」，意思相近的國語諺語：欲（　）則不達。", "opts": ["急", "速", "快", "進"], "ans": 1, "exp": "出自《論語》：「欲速則不達。」", "src": "課本 p.94 二-14"}, {"stem": "閩語諺語「賣茶講茶香，賣花講花紅（調侃人「自己稱讚自己」）」，意思相近的國語諺語：（　）賣瓜，自賣自誇。", "opts": ["老王", "阿婆", "小販", "老張"], "ans": 0, "exp": "老王賣瓜，自賣自誇：自己誇讚自己的東西好。", "src": "課本 p.94 二-15"}, {"stem": "閩語諺語「海水闊闊，船頭也會相遇著（任何事都有發生的可能）」，意思相近的國語諺語：不怕（　），只怕（　）。", "opts": ["一次／萬次", "一千／千一", "一萬／萬一", "萬一／一萬"], "ans": 2, "exp": "不怕一萬，只怕萬一：要防範萬一發生的意外。", "src": "課本 p.94 二-16"}, {"stem": "閩語諺語「時到時擔當，沒米煮番薯湯（事到臨頭再看該怎麼辦）」，意思相近的國語諺語：（　）到橋頭自然（　）。", "opts": ["船／通", "船／直", "車／停", "水／平"], "ans": 1, "exp": "船到橋頭自然直：事情到了緊要關頭自然會有辦法。", "src": "課本 p.95 二-17"}, {"stem": "閩語諺語「神仙打鼓有時錯，腳步踏差誰人無（人都免不了會犯錯）」，意思相近的國語諺語：人非（　），孰能無過。", "opts": ["神仙", "草木", "完人", "聖賢"], "ans": 3, "exp": "人非聖賢，孰能無過：一般人都會犯錯。", "src": "課本 p.95 二-18"}, {"stem": "閩語諺語「美人無美命（長得漂亮的人，往往命運不好）」，意思相近的國語諺語：（　）多薄命。", "opts": ["美女", "紅顏", "才子", "佳人"], "ans": 1, "exp": "紅顏多薄命（紅顏薄命）：美女往往命運坎坷。", "src": "課本 p.95 二-19"}, {"stem": "閩語諺語「龜笑鱉無尾，鱉笑龜粗皮（只批評別人卻不知自己缺點也不少）」，意思相近的國語諺語：（　）步笑（　）步。", "opts": ["一／十", "十／百", "百／五十", "五十／百"], "ans": 3, "exp": "五十步笑百步（出自《孟子》）：自己也有同樣缺點，只是程度輕一點，卻去嘲笑別人。", "src": "課本 p.95 二-20"}, {"stem": "閩語諺語「興家猶如針挑土，敗家猶如水推舟（創業難、敗家易）」，意思相近的國語諺語：（　）維艱，（　）不易。", "opts": ["起家／持家", "創業／守成", "創業／守城", "成家／立業"], "ans": 1, "exp": "創業維艱，守成不易。「守成」是保持已有的成就，不是「守城」。", "src": "課本 p.95 二-21"}, {"stem": "閩語諺語「濛濛雨，落久土也會溼（毛毛雨下久了地面也會溼透）」，意思相近的國語諺語：（　）之木，生於毫末；九層之臺，起於（　）。", "opts": ["參天／平地", "合抱／合抱", "合抱／累土", "大樹／磚瓦"], "ans": 2, "exp": "出自《老子》：「合抱之木，生於毫末；九層之臺，起於累土。」比喻積少成多。第二格是「累土」。", "src": "課本 p.95 二-22"}, {"stem": "閩語諺語「錢沒兩個袂鏘（兩個錢幣沒碰在一起不會發出聲響）」，意思相近的國語諺語：一個（　）拍不響。", "opts": ["銅板", "手指", "巴掌", "拳頭"], "ans": 2, "exp": "一個巴掌拍不響：衝突往往雙方都有責任。", "src": "課本 p.95 二-23"}, {"stem": "閩語諺語「假憨使軟錢（利用人性貪的弱點，裝笨騙凱子的錢）」，意思相近的國語諺語：扮（　）吃（　）。", "opts": ["豬／狐狸", "豬／老虎", "虎／豬", "羊／老虎"], "ans": 1, "exp": "扮豬吃老虎：裝傻讓對方失去戒心，再趁機得利。", "src": "課本 p.95 二-24"}, {"stem": "閩語諺語「無錢假大辦（沒錢卻假裝慷慨、充闊佬）」，意思相近的國語諺語：打腫臉充（　）。", "opts": ["老大", "好漢", "英雄", "胖子"], "ans": 3, "exp": "打腫臉充胖子：為了面子硬撐。", "src": "課本 p.95 二-25"}, {"stem": "閩語諺語「教豬教狗，不如家己走」，意思相近的國語諺語：求（　）不如求（　）。", "opts": ["人／己", "己／人", "神／人", "天／地"], "ans": 0, "exp": "求人不如求己：靠自己最可靠。", "src": "課本 p.95 三-1"}, {"stem": "閩語諺語「歹歹馬，也有一步踢」，意思相近的國語諺語：天生我（　）必有用。", "opts": ["財", "才", "才能", "材"], "ans": 3, "exp": "出自李白〈將進酒〉：「天生我材必有用。」正字是「材」，不是「才」。", "src": "課本 p.95 三-2"}, {"stem": "閩語諺語「爛土，不糊得壁」，意思相近的國語諺語：（　）不可雕。", "opts": ["爛泥", "枯木", "頑石", "朽木"], "ans": 3, "exp": "出自《論語》：「朽木不可雕也，糞土之牆不可杇也。」比喻無法造就。", "src": "課本 p.95 三-3"}, {"stem": "閩語諺語「沒魚，蝦也好」，意思相近的國語諺語：退而求（　）。", "opts": ["其中", "其他", "其次", "其實"], "ans": 2, "exp": "退而求其次：得不到最好的，就選次好的。", "src": "課本 p.95 三-4"}, {"stem": "閩語諺語「吃人一口，還人一斗」，意思相近的國語諺語：（　）之恩，（　）以報。", "opts": ["湧泉／點滴", "一飯／千金", "滴水／泉水", "點滴／湧泉"], "ans": 3, "exp": "點滴之恩，湧泉以報（也常說「滴水之恩，湧泉以報」）：受人小恩要加倍報答。本書 p.99 第 4 題就用「點滴之恩，湧泉以報」。", "src": "課本 p.95 三-5"}, {"stem": "閩語諺語「生雞蛋無，放雞屎有」，意思相近的國語諺語：（　）不足，（　）有餘。", "opts": ["敗事／成事", "成功／失敗", "做事／壞事", "成事／敗事"], "ans": 3, "exp": "成事不足，敗事有餘：辦不好事情，反而只會壞事。", "src": "課本 p.95 三-6"}, {"stem": "閩語諺語「有肉，嫌無菜」，意思相近的國語諺語：人在（　）不知福。", "opts": ["苦中", "家中", "世中", "福中"], "ans": 3, "exp": "人在福中不知福：身處幸福卻不知道珍惜。", "src": "課本 p.95 三-7"}, {"stem": "閩語諺語「軟土深掘」，意思相近的國語諺語：（　）挑軟的吃。", "opts": ["柿子", "饅頭", "豆腐", "桃子"], "ans": 0, "exp": "柿子挑軟的吃：專挑好欺負的人下手。", "src": "課本 p.96 三-8"}, {"stem": "閩語諺語「大狗爬牆，小狗看樣」，意思相近的國語諺語：上梁不正（　）歪。", "opts": ["下郎", "下梁", "中梁", "屋梁"], "ans": 1, "exp": "上梁不正下梁歪：上面的人行為不正，下面的人也跟著學壞。正字「下梁」。", "src": "課本 p.96 三-9"}, {"stem": "閩語諺語「三年一閏，好歹照輪」，意思相近的國語諺語：（　）輪流轉。", "opts": ["日月", "好運", "風水", "時間"], "ans": 2, "exp": "風水輪流轉：好運壞運會輪替。", "src": "課本 p.96 三-10"}], "ref": "<p>注意正確字形：黃<b>連<\/b>（不是蓮）、守<b>成<\/b>（不是城）、天生我<b>材<\/b>、上梁不正<b>下梁<\/b>歪、累土。<\/p>"}, {"id": "zhongwai", "title": "中外諺語比一比", "items": [{"stem": "外國諺語「好名聲睡在火爐邊，壞名聲傳到天邊。（歐洲）」，對應的中國諺語：（　）不出門，（　）傳千里。", "opts": ["好事／壞事", "好話／壞話", "喜事／醜事", "壞事／好事"], "ans": 0, "exp": "好事不出門，壞事傳千里：壞名聲傳得特別快。", "src": "課本 p.96 中外俗諺一-1"}, {"stem": "外國諺語「說貓，貓來；說狼，狼來。（歐洲）」，對應的中國諺語：說（　），（　）到。", "opts": ["關公／關公", "曹操／孔明", "曹操／曹操", "孔明／孔明"], "ans": 2, "exp": "說曹操，曹操到：剛提到某人，他就出現了。", "src": "課本 p.96 中外俗諺一-2"}, {"stem": "外國諺語「與其做獅尾，不如做狗頭。（英國）」，對應的中國諺語：寧為（　），不為（　）。", "opts": ["雞頭／鳳尾", "牛後／雞口", "虎頭／蛇尾", "雞口／牛後"], "ans": 3, "exp": "出自《戰國策》：「寧為雞口，無為牛後。」（也作雞首）寧可在小團體當領導，也不在大團體當跟班。", "src": "課本 p.96 中外俗諺一-3"}, {"stem": "外國諺語「儘管活到一千歲，棺材還是要準備。（蘇格蘭）」，對應的中國諺語：人生自古誰無（　），只是來早與來遲。", "opts": ["苦", "病", "老", "死"], "ans": 3, "exp": "人終究會死，只是早晚不同。", "src": "課本 p.96 中外俗諺一-4"}, {"stem": "外國諺語「若有安樂的窩，不會想要帝王家。（荷蘭）」，對應的中國諺語：金窩、銀窩不如自己的（　）。", "opts": ["狗窩", "小窩", "草窩", "鳥窩"], "ans": 0, "exp": "金窩銀窩，不如自己的狗窩：自己的家最舒服。", "src": "課本 p.96 中外俗諺一-5"}, {"stem": "外國諺語「一個銅板沒聲，兩個銅板響叮噹。（西班牙）」，對應的中國諺語：一個（　）拍不響。", "opts": ["銅板", "鼓", "手指", "巴掌"], "ans": 3, "exp": "一個巴掌拍不響：事情是雙方造成的。", "src": "課本 p.96 中外俗諺一-6"}, {"stem": "外國諺語「無中總不會生有，多少有點苗頭。（挪威）」，對應的中國諺語：無風不起（　），空穴不來（　）。", "opts": ["風／浪", "波／雨", "雨／雲", "浪／風"], "ans": 3, "exp": "無風不起浪，空穴來風：事出必有因。第一格只填「浪」。", "src": "課本 p.96 中外俗諺一-7"}, {"stem": "外國諺語「痛苦才想到神佛。（日本）」，對應的中國諺語：平時不燒香，臨時（　）。", "opts": ["點蠟燭", "抱佛腳", "拜祖先", "求神明"], "ans": 1, "exp": "平時不燒香，臨時抱佛腳：平時不準備，事到臨頭才慌忙應付。", "src": "課本 p.96 中外俗諺一-8"}, {"stem": "外國諺語「人要衣裳，馬要鞍！（日本）」，對應的中國諺語：人要（　），佛要（　）。", "opts": ["衣服／香火", "衣裝／金裝", "金裝／衣裝", "打扮／供品"], "ans": 1, "exp": "人要衣裝，佛要金裝：外表的打扮很重要。", "src": "課本 p.96 中外俗諺一-9"}, {"stem": "外國諺語「你可以看到他穿什麼，卻不能看到他想什麼。（寮國）」，對應的中國諺語：知人知面（　）。", "opts": ["不知情", "難知心", "不知名", "不知心"], "ans": 3, "exp": "知人知面不知心：看得到外表看不透內心。", "src": "課本 p.96 中外俗諺一-10"}, {"stem": "外國諺語「老虎不吃小虎子，老子不殺傻兒子。（柬埔寨）」，對應的中國諺語：虎毒不食（　）。", "opts": ["肉", "母", "人", "子"], "ans": 3, "exp": "虎毒不食子：再兇的人也愛護自己的孩子。", "src": "課本 p.96 中外俗諺一-11"}, {"stem": "外國諺語「烏鴉生不出鴿子，鴨生不出鵝。（委內瑞拉）」，對應的中國諺語：龍生（　），鳳生（　）。", "opts": ["龍／鳳", "虎／凰", "蛇／雞", "鳳／龍"], "ans": 0, "exp": "龍生龍，鳳生鳳（老鼠生的兒子會打洞）：子女像父母。", "src": "課本 p.96 中外俗諺一-12"}]}, {"id": "peidui", "title": "中外俗諺配對", "items": [{"stem": "外國諺語「你若愛獵人，也請愛獵狗。（剛果）」意思相近的中國諺語是？", "opts": ["遠親不如近鄰", "百聞不如一見", "愛屋及烏", "物以類聚"], "ans": 2, "exp": "愛一個人，連帶也愛和他有關的人事物＝愛屋及烏。", "src": "課本 p.97 二-1"}, {"stem": "外國諺語「父親說謊，兒子撒謊。（日本）」意思相近的中國諺語是？", "opts": ["有其父必有其子", "生於憂患，死於安樂", "不經一事，不長一智", "樹大招風"], "ans": 0, "exp": "兒子學父親＝有其父必有其子。", "src": "課本 p.97 二-2"}, {"stem": "外國諺語「給小偷足夠的繩子，他就會自己上吊。（西諺）」意思相近的中國諺語是？", "opts": ["多行不義必自斃", "生於憂患，死於安樂", "天下沒有白吃的午餐", "殺雞焉用牛刀"], "ans": 0, "exp": "壞事做多了，終會自取滅亡＝多行不義必自斃。", "src": "課本 p.97 二-3"}, {"stem": "外國諺語「最高的樹枝不是最安全的鳥巢。（西諺）」意思相近的中國諺語是？", "opts": ["樹大招風", "多行不義必自斃", "人有失手，馬有亂蹄", "有其父必有其子"], "ans": 0, "exp": "地位越高越容易成為攻擊目標＝樹大招風。", "src": "課本 p.97 二-4"}, {"stem": "外國諺語「聽十次，不如看一次。（德國）」意思相近的中國諺語是？", "opts": ["百聞不如一見", "殺雞焉用牛刀", "遠親不如近鄰", "多行不義必自斃"], "ans": 0, "exp": "聽再多不如親眼看＝百聞不如一見。", "src": "課本 p.97 二-5"}, {"stem": "外國諺語「殺蚊子何必拔刀。（韓國）」意思相近的中國諺語是？", "opts": ["遠親不如近鄰", "殺雞焉用牛刀", "有其父必有其子", "百聞不如一見"], "ans": 1, "exp": "小事不必用大力氣＝殺雞焉用牛刀。", "src": "課本 p.97 二-6"}, {"stem": "外國諺語「隔海的有錢兄弟，不如貧窮的隔壁鄰居。（歐洲）」意思相近的中國諺語是？", "opts": ["殺雞焉用牛刀", "遠親不如近鄰", "萬物靜觀皆自得", "生於憂患，死於安樂"], "ans": 1, "exp": "遠方的親人不如身邊的鄰居能及時幫忙＝遠親不如近鄰。", "src": "課本 p.97 二-7"}, {"stem": "外國諺語「牛找牛，馬找馬。（英國）」意思相近的中國諺語是？", "opts": ["百聞不如一見", "物以類聚", "人有失手，馬有亂蹄", "會叫的狗不咬人"], "ans": 1, "exp": "同類的聚在一起＝物以類聚。", "src": "課本 p.97 二-8"}, {"stem": "外國諺語「一沙一世界，一花一天堂。（英國）」意思相近的中國諺語是？", "opts": ["多行不義必自斃", "樹大招風", "愛屋及烏", "萬物靜觀皆自得"], "ans": 3, "exp": "出自英國詩人布雷克。靜心觀察，一粒沙、一朵花都蘊含世界的道理＝程顥「萬物靜觀皆自得」。不是「愛屋及烏」。", "src": "課本 p.97 二-9"}, {"stem": "外國諺語「經驗為最好的導師。（英國）」意思相近的中國諺語是？", "opts": ["不經一事，不長一智", "人有失手，馬有亂蹄", "百聞不如一見", "會叫的狗不咬人"], "ans": 0, "exp": "經歷過才學得到＝不經一事，不長一智。", "src": "課本 p.97 二-10"}, {"stem": "外國諺語「靜海之中，造不出一個好的水手。（西諺）」意思相近的中國諺語是？", "opts": ["多行不義必自斃", "生於憂患，死於安樂", "物以類聚", "殺雞焉用牛刀"], "ans": 1, "exp": "安逸的環境練不出能力，憂患才能使人成長＝生於憂患，死於安樂。", "src": "課本 p.97 二-11"}, {"stem": "外國諺語「黃金隨潮水而來，也要早起去撈它。（西諺）」意思相近的中國諺語是？", "opts": ["有其父必有其子", "萬物靜觀皆自得", "天下沒有白吃的午餐", "殺雞焉用牛刀"], "ans": 2, "exp": "想得到好處就必須付出＝天下沒有白吃的午餐。", "src": "課本 p.97 二-12"}, {"stem": "外國諺語「小心不吠的狗和安靜的水面。（西諺）」意思相近的中國諺語是？", "opts": ["愛屋及烏", "遠親不如近鄰", "多行不義必自斃", "會叫的狗不咬人"], "ans": 3, "exp": "不出聲的才可怕，會叫的狗反而不咬人＝會叫的狗不咬人。", "src": "課本 p.97 二-13"}, {"stem": "外國諺語「再好的馬也有絆倒之時。（西諺）」意思相近的中國諺語是？", "opts": ["遠親不如近鄰", "多行不義必自斃", "會叫的狗不咬人", "人有失手，馬有亂蹄"], "ans": 3, "exp": "再厲害的人也會失誤＝人有失手，馬有亂蹄。", "src": "課本 p.97 二-14"}, {"stem": "There is no rose without a thorn.（朵朵玫瑰皆有刺），意思相近的是？", "opts": ["公說公有理，婆說婆有理", "沒有十全十美的人生", "引爆的關鍵點", "風水輪流轉"], "ans": 1, "exp": "再美的玫瑰也有刺＝沒有十全十美的人生。", "src": "課本 p.98 三-1"}, {"stem": "There are two sides to every question.（每個問題都有正反兩面看法），意思相近的是？", "opts": ["風水輪流轉", "公說公有理，婆說婆有理", "沒有十全十美的人生", "引爆的關鍵點"], "ans": 1, "exp": "每件事都有兩面說法＝公說公有理，婆說婆有理。", "src": "課本 p.98 三-2"}, {"stem": "An eye for an eye, and we will all go blind.（以眼還眼，讓我們全都瞎眼），意思相近的是？", "opts": ["以牙還牙，兩敗俱傷", "風水輪流轉", "公說公有理，婆說婆有理", "沒有十全十美的人生"], "ans": 0, "exp": "互相報復只會雙方受害＝以牙還牙，兩敗俱傷。", "src": "課本 p.98 三-3"}, {"stem": "The straw that breaks the camel's back.（壓垮駱駝的最後一根稻草），意思相近的是？", "opts": ["引爆的關鍵點", "風水輪流轉", "以牙還牙，兩敗俱傷", "沒有十全十美的人生"], "ans": 0, "exp": "最後一個小因素引發崩潰＝引爆的關鍵點。", "src": "課本 p.98 三-4"}, {"stem": "Every dog has his day.（每隻狗都有牠的日子），意思相近的是？", "opts": ["風水輪流轉", "沒有十全十美的人生", "公說公有理，婆說婆有理", "以牙還牙，兩敗俱傷"], "ans": 0, "exp": "人人都有走運的時候＝風水輪流轉。", "src": "課本 p.98 三-5"}]}, {"id": "lianlian", "title": "俗諺連連看", "items": [{"stem": "閩南俗諺「大隻雞慢啼」對應的國語詞語是？", "opts": ["見機行事", "大器晚成", "粗心大意", "勢利眼"], "ans": 1, "exp": "大公雞比較晚才會啼，比喻有才能的人較晚成功＝大器晚成。", "src": "課本 p.97 完封一-1"}, {"stem": "閩南俗諺「西瓜偎大邊」對應的國語詞語是？", "opts": ["大器晚成", "見機行事", "勢利眼", "粗心大意"], "ans": 2, "exp": "切西瓜時靠向大的那一邊，比喻依附勢力大的一方＝勢利眼（趨炎附勢）。", "src": "課本 p.97 完封一-2"}, {"stem": "閩南俗諺「大目新娘找無灶」對應的國語詞語是？", "opts": ["勢利眼", "大器晚成", "粗心大意", "神出鬼沒"], "ans": 2, "exp": "眼睛大的新娘卻找不到灶，比喻粗心看不到眼前的東西＝粗心大意。（照片中原文較模糊）", "src": "課本 p.97 完封一-3"}, {"stem": "閩南俗諺「一時風駛一時帆」對應的國語詞語是？", "opts": ["見機行事", "大器晚成", "勢利眼", "粗心大意"], "ans": 0, "exp": "看當時的風向調整船帆＝見機行事。", "src": "課本 p.97 完封一-4"}, {"stem": "閩南俗諺「來無聲，去無影」對應的國語詞語是？", "opts": ["大器晚成", "勢利眼", "見機行事", "神出鬼沒"], "ans": 3, "exp": "來去都不留痕跡＝神出鬼沒。", "src": "課本 p.97 完封一-5"}, {"stem": "國語俗諺「老驥伏櫪，志在千里」對應的詞語是？", "opts": ["欲蓋彌彰", "老當益壯", "要求高付出少", "有真才實學"], "ans": 1, "exp": "出自曹操〈龜雖壽〉，老馬雖臥在馬槽仍想奔馳千里＝老當益壯。", "src": "課本 p.98 二-1"}, {"stem": "國語俗諺「走了和尚，走不了廟」對應的詞語是？", "opts": ["有真才實學", "要求高付出少", "終究難逃", "欲蓋彌彰"], "ans": 2, "exp": "人跑了，廟還在，還是找得到＝終究難逃。", "src": "課本 p.98 二-2"}, {"stem": "國語俗諺「此地無銀三百兩」對應的詞語是？", "opts": ["要求高付出少", "終究難逃", "欲蓋彌彰", "老當益壯"], "ans": 2, "exp": "想掩飾反而暴露得更明顯＝欲蓋彌彰。", "src": "課本 p.98 二-3"}, {"stem": "國語俗諺「又要馬兒好，又要馬兒不吃草」對應的詞語是？", "opts": ["終究難逃", "欲蓋彌彰", "要求高付出少", "老當益壯"], "ans": 2, "exp": "想要好結果卻不肯付出＝要求高付出少。", "src": "課本 p.98 二-4"}, {"stem": "國語俗諺「沒有三兩三，不敢上梁山」對應的詞語是？", "opts": ["終究難逃", "老當益壯", "有真才實學", "要求高付出少"], "ans": 2, "exp": "沒有真本事就不敢去冒險＝有真才實學。", "src": "課本 p.98 二-5"}]}, {"id": "xuanze", "title": "輕鬆完封大晉級：選擇題", "items": [{"stem": "蕭峰個性剛正，有時為了正義毫不給人留點面子，如果你想要規勸他說話婉轉些，應該給他哪一句話較好？", "opts": ["不會駛船，嫌溪彎", "人情留一線，日後好相看", "歹竹出好筍", "有嘴說到無涎"], "ans": 1, "exp": "「人情留一線，日後好相看」勸人做事留餘地。(A)自己不會卻怪環境 (C)不好的父母生出好子女 (D)說到口乾也沒用。", "src": "課本 p.98 四-1"}, {"stem": "岳飛統帥大兵席捲中原，正值出師大捷時候，被高宗的十二道金牌催回，秦檜進獻讒言，導致岳飛以「莫須有」的罪名被處以死刑，這情況真可謂□□□□，□□□□？", "opts": ["欲加之罪，何患無辭", "星星之火，可以燎原", "人之將死，其言也善", "福無雙至，禍不單行"], "ans": 0, "exp": "想加罪於人，不怕找不到藉口＝欲加之罪，何患無辭，正符合「莫須有」。", "src": "課本 p.98 四-2"}, {"stem": "下列諺語與人物事件的配對，何者正確？", "opts": ["王強平日不苟言笑——一言既出，駟馬難追", "李司撞車逃逸，三個月後落網——拆穿西洋鏡", "盧星一向尸位素餐——占著茅坑不拉屎", "大牛力氣大如山——食若牛，做若龜"], "ans": 2, "exp": "尸位素餐＝占著職位不做事＝占著茅坑不拉屎。(A)該句指說話守信，與不苟言笑無關 (B)逃逸落網應是「天網恢恢，疏而不漏」(D)「食若牛，做若龜」指吃得多做得慢，與力氣大無關。", "src": "課本 p.98 四-3"}, {"stem": "淮陰侯韓信未得志時，曾經受漂母（洗衣服的婦人）贈送一碗飯止飢，後來以千金回報，韓信的行為可用下列哪項諺語形容？", "opts": ["善有善報，惡有惡報", "點滴之恩，湧泉以報", "投我以桃，報之以李", "君子愛財，取之有道"], "ans": 1, "exp": "一碗飯的小恩，用千金回報＝點滴之恩，湧泉以報。(C)是禮尚往來、對等回報，沒有「加倍」的意思。", "src": "課本 p.99 四-4"}, {"stem": "美國總統羅斯福說：「我們唯一必須害怕的事乃害怕本身。」這句話勉勵我們什麼道理？", "opts": ["害怕是極為恐怖的事，它讓我們更加害怕", "做任何事情都必須懷著戒慎恐懼的心，才能成功", "一旦能夠克服自身的恐懼，凡事必能迎刃而解", "沒有任何事比「害怕」還要恐怖"], "ans": 2, "exp": "重點是「勉勵」：只要克服心中的恐懼，就能面對困難。(A)(D)只是字面重述，沒有勉勵的意思。", "src": "課本 p.99 四-5"}, {"stem": "老師要同學蒐集勵志類的諺語，下列是李威所寫出的諺語，哪一項前後有相同的寓意？", "opts": ["靠山山會崩，靠水水會焦／自立自強", "打斷手骨顛倒勇／三折肱而成良醫", "人情世事陪夠夠，無鼎閣無灶／兩袖清風", "做牛著拖，做人著磨／未雨綢繆"], "ans": 0, "exp": "靠山會崩、靠水會乾，只能靠自己＝自立自強。(B)前者越挫越勇，後者是經驗多成專家 (C)前者應酬太多會窮到沒鍋沒灶，後者是為官清廉 (D)前者指做人要吃苦打拚，後者是事先準備。", "src": "課本 p.99 四-6"}, {"stem": "下列諺語的運用，何者正確？", "opts": ["主將受傷，所以籃球賽只能叫二軍上場，真是「蜀中無大將，廖化作先鋒」", "你如此陰魂不散的跟著我，讓我有「死諸葛嚇走活仲達」的感覺", "俗話說：「得失土地公，飼無雞」，不虔誠祭拜，就不會受到庇佑", "他買獎券槓龜兩次，錢包又被偷，的確是「仙拼仙，害死猴齊天」"], "ans": 0, "exp": "「蜀中無大將，廖化作先鋒」指缺乏人才，只好由能力較差的人頂替，用得正確。(B)指死人的計謀仍能嚇退活人 (C)指得罪了掌權的人就會吃虧 (D)指兩強相爭、旁人遭殃。", "src": "課本 p.99 四-7"}, {"stem": "下列諺語，何者解釋正確？", "opts": ["「臨陣磨槍，不亮也光」：臨陣脫逃也能躲過一劫", "「人爭一口氣，佛爭一炷香」：人要爭強好勝要面子", "「量小非君子，無毒不丈夫」：經得起艱苦考驗，才算是大丈夫", "「羅馬不是一天造成的」：團結力量大"], "ans": 1, "exp": "(B)正確。(A)指臨時準備也有點用 (C)指度量小不是君子，原作「無度不丈夫」，與艱苦考驗無關 (D)指成功需要長時間累積。", "src": "課本 p.99 四-8"}, {"stem": "西諺「金窩、銀窩，不如自家狗窩。」這句話的意思同於下列何者？", "opts": ["一登龍門，聲價十倍", "江山易改，本性難移", "癩痢頭的兒子還是自己的好", "肥水不落外人田"], "ans": 2, "exp": "兩句都是說「自己的最好」。(D)是好處留給自己人，意思不同。", "src": "課本 p.99 四-9"}, {"stem": "「王家歷經三代的披荊斬棘，事業才能有今日規模，可惜第四代子孫竟然沉迷賭博導致債臺高築，如今只得將公司拱手讓人。」上述情形，可以用哪一句俗諺來形容？", "opts": ["賺錢有數，生命著顧", "起厝動千工，拆厝一陣風", "好天也著積雨來糧", "三年一閏，好壞照輪"], "ans": 1, "exp": "蓋房子要很多工夫，拆掉只要一下子＝創業難、敗家易。", "src": "課本 p.99 四-10"}]}], "intro": "國語俗諺、閩語諺語、中外俗諺對照：把諺語翻成白話，找出意思相近的成語或諺語。"}</script>
