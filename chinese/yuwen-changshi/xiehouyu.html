<script type="application/json" id="bank">{"id": "xiehouyu", "title": "歇後語", "eyebrow": "語文常識 · 單元 8", "sections": [{"id": "sanguo1", "title": "三國群雄傳：人物", "items": [{"stem": "歇後語「魯肅上了（　）船——糊裡糊塗」，空格應填？", "opts": ["司馬懿", "關羽", "黃忠", "孔明"], "ans": 3, "exp": "魯肅是東吳官員，卻上了敵人孔明的船，被孔明利用來傳遞消息。", "src": "課本 p.100 一-1"}, {"stem": "歇後語「（　）射箭——百發百中」，空格應填？", "opts": ["關羽", "曹操", "黃忠", "孔明"], "ans": 2, "exp": "黃忠老當益壯、善射，所以百發百中。", "src": "課本 p.100 一-2"}, {"stem": "歇後語「（　）敗走華容道——兵荒馬亂」，空格應填？", "opts": ["關羽", "劉備", "曹操", "黃忠"], "ans": 2, "exp": "曹操赤壁之戰大敗，最後敗走華容道。", "src": "課本 p.100 一-3"}, {"stem": "歇後語「孫權殺（　）——嫁禍於人」，空格應填？", "opts": ["關羽", "黃忠", "司馬懿", "劉備"], "ans": 0, "exp": "孫權殺了關羽後，把關羽首級送給曹操，想嫁禍給曹操。", "src": "課本 p.100 一-4"}, {"stem": "歇後語「（　）破八卦陣——不懂裝懂」，空格應填？", "opts": ["黃忠", "曹操", "司馬懿", "孔明"], "ans": 2, "exp": "司馬懿不懂八卦陣卻嘴硬逞強，結果破不了。", "src": "課本 p.100 一-5"}, {"stem": "歇後語「（　）揮淚斬馬謖——執法如山」，空格應填？", "opts": ["關羽", "曹操", "孔明", "劉備"], "ans": 2, "exp": "馬謖失街亭，孔明雖然器重他，仍依軍法斬他。不是曹操。", "src": "課本 p.100 一-6"}, {"stem": "歇後語「（　）彈琴退仲達——臨危不亂」，空格應填？", "opts": ["司馬懿", "劉備", "關羽", "孔明"], "ans": 3, "exp": "孔明唱空城計，從容彈琴嚇退司馬懿（字仲達）。", "src": "課本 p.100 一-7"}, {"stem": "歇後語「（　）三顧茅廬——好難請」，空格應填？", "opts": ["關羽", "曹操", "黃忠", "劉備"], "ans": 3, "exp": "劉備三次拜訪才請到孔明。", "src": "課本 p.100 一-8"}], "ref": "<p>歇後語＝前半「比喻/引子」＋後半「真正意思」。三國歇後語要記住人物和故事：孔明（空城計、草船借箭、錦囊、揮淚斬馬謖）、曹操（敗走華容道）、關羽（降曹、面前耍大刀、放屁不知臉紅）、張飛（繡花、拆橋）。<\/p>"}, {"id": "sanguo2", "title": "三國群雄傳：意義", "items": [{"stem": "歇後語「看三國掉淚——替（　）擔憂」，空格應填？", "opts": ["古人", "漢", "計", "曹營"], "ans": 0, "exp": "三國故事已成定局，替古人擔憂實在多餘。", "src": "課本 p.101 一-9"}, {"stem": "歇後語「周瑜謀荊州——賠了（　）又折（　）」，空格應填？", "opts": ["夫人／兵", "美人／兵", "夫人／英雄", "兵／夫人"], "ans": 0, "exp": "周瑜假意把孫權妹妹嫁給劉備想殺他，被孔明識破，結果賠了夫人又折兵。", "src": "課本 p.101 一-10"}, {"stem": "歇後語「阿斗的江山——（　）」，空格應填？", "opts": ["白送", "草船", "計", "美人"], "ans": 0, "exp": "阿斗沒能力做皇帝，江山留給他也是白送。", "src": "課本 p.101 一-11"}, {"stem": "歇後語「關羽降曹操——身在（　）心在（　）」，空格應填？", "opts": ["漢／曹營", "曹營／美人", "古人／漢", "曹營／漢"], "ans": 3, "exp": "關羽投降曹操後心仍向著劉備（漢）。", "src": "課本 p.101 一-12"}, {"stem": "歇後語「（　）借箭——滿載而歸」，空格應填？", "opts": ["美人", "曹營", "漢", "草船"], "ans": 3, "exp": "孔明用草船向曹操「借」了十萬支箭。", "src": "課本 p.101 一-13"}, {"stem": "歇後語「呂布戲貂蟬——（　）難過（　）關」，空格應填？", "opts": ["英雄／美人", "古人／美人", "美人／英雄", "英雄／夫人"], "ans": 0, "exp": "呂布為了貂蟬背叛董卓＝英雄難過美人關。", "src": "課本 p.101 一-14"}, {"stem": "歇後語「孔明的錦囊——用不完的（　）」，空格應填？", "opts": ["曹營", "計", "白送", "英雄"], "ans": 1, "exp": "孔明神機妙算，計謀多到用不完。", "src": "課本 p.101 一-15"}, {"stem": "歇後語「董卓進京」的意義是？", "opts": ["收買人心", "不懷好意", "自家人整自家人", "一言不發"], "ans": 1, "exp": "董卓假稱帶兵保護皇帝，其實想挾天子以令諸侯。", "src": "課本 p.102 一-16"}, {"stem": "歇後語「劉備摔孩子」的意義是？", "opts": ["粗中有細", "自家人整自家人", "收買人心", "不懷好意"], "ans": 2, "exp": "趙雲救回阿斗，劉備把阿斗摔在地上，表示不能為兒子折損大將，以此收買人心。", "src": "課本 p.102 一-17"}, {"stem": "歇後語「周瑜打黃蓋——一個（　），一個（　）」，空格應填？", "opts": ["願打／不打", "苦打／願受", "願打／願挨", "願挨／願打"], "ans": 2, "exp": "周瑜和黃蓋一起演苦肉計，一個願打、一個願挨＝雙方心甘情願。", "src": "課本 p.102 一-18"}, {"stem": "歇後語「徐庶進曹營」的意義是？", "opts": ["粗中有細", "有勇無謀", "一言不發", "自家人整自家人"], "ans": 2, "exp": "徐庶被騙進曹營，為表忠於劉備，從不為曹操出主意。", "src": "課本 p.102 一-19"}, {"stem": "歇後語「煮豆燃豆萁」的意義是？", "opts": ["不自量力", "收買人心", "粗中有細", "自家人整自家人"], "ans": 3, "exp": "曹植七步詩諷刺哥哥曹丕不顧手足之情。", "src": "課本 p.102 一-20"}, {"stem": "歇後語「關雲長放屁」的意義是？", "opts": ["不知臉紅", "粗中有細", "一言不發", "不懷好意"], "ans": 0, "exp": "關公的臉本來就是紅的。", "src": "課本 p.102 一-21"}, {"stem": "歇後語「張飛繡花」的意義是？", "opts": ["粗中有細", "自家人整自家人", "有勇無謀", "收買人心"], "ans": 0, "exp": "粗人張飛做細緻的繡花工作。", "src": "課本 p.102 一-22"}, {"stem": "歇後語「張飛拆橋」的意義是？", "opts": ["不知臉紅", "有勇無謀", "自家人整自家人", "粗中有細"], "ans": 1, "exp": "張飛拆了橋，反讓曹操知道沒有伏兵。", "src": "課本 p.102 一-23"}, {"stem": "歇後語「關公面前耍大刀」的意義是？", "opts": ["不懷好意", "不知臉紅", "收買人心", "不自量力"], "ans": 3, "exp": "在使大刀的關公面前耍刀，貽笑大方。", "src": "課本 p.102 一-24"}]}, {"id": "sanguo3", "title": "人物類：選擇題", "items": [{"stem": "中國的歇後語形式上是半截話，讓人從前面的話語去推測。下列歇後語，何者完全正確？", "opts": ["張飛穿針——小心眼", "張飛繡花——花拳繡腿", "張飛拆橋——有勇無謀", "張飛吃豆芽——不自量力"], "ans": 2, "exp": "(A)張飛穿針＝大眼瞪小眼 (B)張飛繡花＝粗中有細 (D)張飛吃豆芽＝小菜一碟。", "src": "課本 p.102 二-1"}, {"stem": "「據洛杉磯時報的一項最新民意調查顯示，多數加州選民希望現任州長戴維斯能夠在罷免選舉中下臺。而眾多的州長候選人中，目前共和黨人阿諾．史瓦辛格當選的呼聲最高。」這則新聞最適合用下列哪一個歇後語當標題？", "opts": ["阿諾擁有孔明的錦囊", "阿諾效法董卓進京", "阿諾媲美孔明彈琴退仲達", "阿諾聲勢如初一潮水"], "ans": 3, "exp": "初一（十五）的潮水——大漲，形容聲勢高漲、呼聲最高。(A)計謀多 (B)不懷好意 (C)臨危不亂，都和「呼聲最高」無關。", "src": "課本 p.103 二-2"}, {"stem": "「想要當情報員還真不容易……若不幸被敵人俘虜，還得效法□□□□□以免洩露機密，危及國家安全。」空格適合填哪一個歇後語？", "opts": ["呂布戲貂蟬", "徐庶進曹營", "劉備摔孩子", "周瑜謀荊州"], "ans": 1, "exp": "徐庶進曹營——一言不發，被俘也不洩密。", "src": "課本 p.103 二-3"}, {"stem": "陳小榮為戲「天下第一味」宣傳，向專業廚師下戰書。專業廚師的小籠湯包完美上臺，陳小榮的湯包卻或方或圓或不規則，最後陳小榮自嘲：「果然是□□□□□□□，以後再也不敢這樣惡搞了。」最適合填？", "opts": ["曹操敗走華容道", "關公面前耍大刀", "司馬懿破八卦陣", "看三國掉淚"], "ans": 1, "exp": "在專家面前賣弄＝關公面前耍大刀——不自量力。(C)是不懂裝懂，但題目重點是在高手面前獻醜。", "src": "課本 p.103 二-4"}, {"stem": "「名模林志玲是今年尾牙最搶手的主持人……康康科技因為尾牙活動規畫作業較慢，所以無緣邀請第一名模同樂。活動組主任不禁大嘆：『邀請林志玲，比登天還難啊！』」適合用哪一句歇後語作標題？", "opts": ["黃忠射箭", "草船借箭", "孔明的錦囊", "劉備三顧茅廬"], "ans": 3, "exp": "劉備三顧茅廬——好難請。", "src": "課本 p.103 二-5"}, {"stem": "「清 劉墉不僅正氣凜然，執法如山，而且用自己的學識和機智，破獲了無數的大案、要案、案中案，被老百姓稱為『劉青天』。」劉墉的辦案態度和哪一句歇後語最接近？", "opts": ["孔明揮淚斬馬謖", "關羽降曹操", "孫權殺關羽", "周瑜打黃蓋"], "ans": 0, "exp": "孔明揮淚斬馬謖——執法如山。", "src": "課本 p.103 二-6"}, {"stem": "下列有關關羽的歇後語，何者解釋錯誤？", "opts": ["關雲長放屁——不知臉紅", "關公面前耍大刀——不自量力", "關羽降曹操——白送", "孫權殺關羽——嫁禍於人"], "ans": 2, "exp": "關羽降曹操——身在曹營心在漢。「白送」是「阿斗的江山」。", "src": "課本 p.103 二-7"}]}, {"id": "dongwu1", "title": "動物類：填動物", "items": [{"stem": "歇後語「（　）子穿新衣——裝人樣」，空格應填哪種動物？", "opts": ["兔", "虎", "猴", "羊"], "ans": 2, "exp": "猴子穿上衣服，裝成人的樣子（沐猴而冠）。", "src": "課本 p.104 一-1"}, {"stem": "歇後語「蛇吞（　）——好大的胃口」，空格應填哪種動物？", "opts": ["雞", "兔", "鱷魚", "象"], "ans": 3, "exp": "蛇想吞大象，比喻貪心。", "src": "課本 p.104 一-2"}, {"stem": "歇後語「獨眼（　）看戲——一目了然」，空格應填哪種動物？", "opts": ["金魚", "兔", "狗", "龍"], "ans": 3, "exp": "「獨眼龍」指只有一隻眼睛的人，一隻眼看戲＝一目了然（雙關）。", "src": "課本 p.104 一-3"}, {"stem": "歇後語「（　）頭上一塊肉——大小是個官（冠）兒」，空格應填哪種動物？", "opts": ["斑馬", "雞", "狗", "烏龜"], "ans": 1, "exp": "雞冠的「冠」諧音「官」，屬諧音式歇後語。", "src": "課本 p.104 一-4"}, {"stem": "歇後語「（　）王的幫手——蝦兵蟹將」，空格應填哪種動物？", "opts": ["狗", "象", "龍", "雞"], "ans": 2, "exp": "龍王手下是蝦兵蟹將。", "src": "課本 p.104 一-5"}, {"stem": "歇後語「（　）打架——硬碰硬」，空格應填哪種動物？", "opts": ["烏龜", "金魚", "象", "猴"], "ans": 0, "exp": "烏龜有硬殼，打架時硬碰硬。", "src": "課本 p.104 一-6"}, {"stem": "歇後語「（　）子看人——眼紅」，空格應填哪種動物？", "opts": ["兔", "狐狸", "猴", "虎"], "ans": 0, "exp": "兔子眼睛是紅的，比喻嫉妒。", "src": "課本 p.104 一-7"}, {"stem": "歇後語「水牛走在（　）群中——矮了一頭」，空格應填哪種動物？", "opts": ["蜘蛛", "象", "狗", "雞"], "ans": 1, "exp": "水牛比大象矮。", "src": "課本 p.104 一-8"}, {"stem": "歇後語「雪地趕白（　）——多少數不清」，空格應填哪種動物？", "opts": ["飛蛾", "龍", "羊", "蜘蛛"], "ans": 2, "exp": "白羊在雪地裡分不清。", "src": "課本 p.104 一-9"}, {"stem": "歇後語「（　）尾巴——搖擺不定」，空格應填哪種動物？", "opts": ["鱷魚", "龍", "金魚", "狗"], "ans": 2, "exp": "金魚尾巴一直擺動。", "src": "課本 p.104 一-10"}, {"stem": "歇後語「畫（　）添足——多此一舉」，空格應填哪種動物？", "opts": ["雞", "蛇", "象", "鱷魚"], "ans": 1, "exp": "蛇本來沒有腳，畫上腳是多此一舉。", "src": "課本 p.104 一-11"}, {"stem": "歇後語「過街老（　）——人人喊打」，空格應填哪種動物？", "opts": ["金魚", "鼠", "蛇", "螞蟻"], "ans": 1, "exp": "老鼠過街，人人都要打。", "src": "課本 p.104 一-12"}, {"stem": "歇後語「（　）困淺灘——有力無處使」，空格應填哪種動物？", "opts": ["鼠", "虎", "龍", "羊"], "ans": 2, "exp": "龍在淺水裡施展不開。", "src": "課本 p.104 一-13"}, {"stem": "歇後語「黃鼠狼給（　）拜年——沒安好心」，空格應填哪種動物？", "opts": ["蜘蛛", "兔", "雞", "烏龜"], "ans": 2, "exp": "黃鼠狼愛吃雞，去拜年是不懷好意。", "src": "課本 p.104 一-14"}, {"stem": "歇後語「兔子進（　）穴——自找死路」，空格應填哪種動物？", "opts": ["螃蟹", "雞", "虎", "金魚"], "ans": 2, "exp": "兔子跑進老虎洞。", "src": "課本 p.104 一-15"}, {"stem": "歇後語「兩（　）相鬥——必有一傷」，空格應填哪種動物？", "opts": ["鱷魚", "螞蟻", "虎", "金魚"], "ans": 2, "exp": "兩隻老虎打架，一定有一隻受傷。", "src": "課本 p.104 一-16"}, {"stem": "歇後語「瞎（　）碰到死老鼠——一時僥倖」，空格應填哪種動物？", "opts": ["螃蟹", "貓", "象", "斑馬"], "ans": 1, "exp": "瞎眼的貓碰巧遇到死老鼠，只是運氣好。", "src": "課本 p.104 一-17"}, {"stem": "歇後語「黃鼠狼咬（　）——無從下手」，空格應填哪種動物？", "opts": ["龍", "烏龜", "羊", "金魚"], "ans": 1, "exp": "烏龜有硬殼，黃鼠狼咬不下去。", "src": "課本 p.104 一-18"}, {"stem": "歇後語「老（　）嘴裡拔牙——自找死路」，空格應填哪種動物？", "opts": ["蛇", "螃蟹", "虎", "鱷魚"], "ans": 2, "exp": "在老虎嘴裡拔牙非常危險。", "src": "課本 p.104 一-19"}, {"stem": "歇後語「（　）過河——七手八腳」，空格應填哪種動物？", "opts": ["烏龜", "螃蟹", "螞蟻", "斑馬"], "ans": 1, "exp": "螃蟹腳多（八隻腳加兩隻螯），橫著走顯得手忙腳亂。", "src": "課本 p.104 一-20"}, {"stem": "歇後語「（　）撲火——自取滅亡」，空格應填哪種動物？", "opts": ["飛蛾", "象", "狐狸", "螃蟹"], "ans": 0, "exp": "飛蛾受光吸引撲向火燒死。", "src": "課本 p.104 一-21"}, {"stem": "歇後語「（　）上岸——來者不善」，空格應填哪種動物？", "opts": ["兔", "斑馬", "鱷魚", "鼠"], "ans": 2, "exp": "鱷魚上岸就是要吃人。", "src": "課本 p.104 一-22"}, {"stem": "歇後語「放（　）歸山——後患無窮」，空格應填哪種動物？", "opts": ["虎", "蛇", "烏龜", "金魚"], "ans": 0, "exp": "把老虎放回山中，以後會繼續傷人。", "src": "課本 p.104 一-23"}, {"stem": "歇後語「（　）吵架——一派胡（狐）言」，空格應填哪種動物？", "opts": ["螞蟻", "狐狸", "金魚", "烏龜"], "ans": 1, "exp": "「狐」諧音「胡」，屬諧音式歇後語。", "src": "課本 p.104 一-24"}, {"stem": "歇後語「（　）捉老鼠——多管閒事」，空格應填哪種動物？", "opts": ["金魚", "鱷魚", "狗", "蜘蛛"], "ans": 2, "exp": "捉老鼠本來是貓的工作，狗去捉就是多管閒事（狗拿耗子）。不是「貓」。", "src": "課本 p.104 一-25"}, {"stem": "歇後語「熱鍋上的（　）——走投無路」，空格應填哪種動物？", "opts": ["兔", "螞蟻", "蛇", "象"], "ans": 1, "exp": "熱鍋上的螞蟻急得團團轉。", "src": "課本 p.104 一-26"}, {"stem": "歇後語「蒼蠅會（　）——自投羅網」，空格應填哪種動物？", "opts": ["猴", "蜘蛛", "狐狸", "鼠"], "ans": 1, "exp": "蒼蠅跑去找蜘蛛，等於自己撞進蜘蛛網。", "src": "課本 p.104 一-27"}, {"stem": "歇後語「（　）的腦袋——頭頭是道」，空格應填哪種動物？", "opts": ["狗", "狐狸", "斑馬", "蛇"], "ans": 2, "exp": "斑馬頭上都是條紋（道道）＝頭頭是道。", "src": "課本 p.104 一-28"}, {"stem": "歇後語「豺狼披（　）皮——充好人」，空格應填哪種動物？", "opts": ["羊", "蛇", "象", "雞"], "ans": 0, "exp": "壞人假裝善良。", "src": "課本 p.104 一-29"}, {"stem": "歇後語「（　）不吃魚——假正經」，空格應填哪種動物？", "opts": ["螃蟹", "虎", "蜘蛛", "貓"], "ans": 3, "exp": "貓一定愛吃魚，說不吃是假裝。", "src": "課本 p.104 一-30"}], "ref": "<p>諧音式歇後語：後半句利用同音字產生雙關。例：雞頭上一塊肉——大小是個官（冠）兒；狐狸吵架——一派胡（狐）言；月亮裡點燈——空掛名（明）。<\/p>"}, {"id": "dongwu2", "title": "動物類：選擇題", "items": [{"stem": "有些歇後語會利用同音或音近的字相諧，如：「狐狸吵架」——是「一派胡（狐）言」之意。下列何者也是屬於諧音式的歇後語？", "opts": ["豺狼披羊皮", "鱷魚上岸", "畫蛇添足", "雞頭上一塊肉"], "ans": 3, "exp": "雞頭上一塊肉——大小是個官（冠）兒，「冠」諧「官」。", "src": "課本 p.105 二-1"}, {"stem": "下列歇後語，何者完全正確？", "opts": ["狗捉老鼠——白費力氣", "貓不吃魚——挑食", "龍困淺灘——有力無處使", "雪地趕白羊——心裡有數"], "ans": 2, "exp": "(A)應為多管閒事 (B)應為假正經 (D)應為多少數不清。", "src": "課本 p.105 二-2"}, {"stem": "下列哪一個歇後語，沒有自找死路的意思？", "opts": ["老虎嘴裡拔牙", "蛇吞象", "飛蛾撲火", "兔子進虎穴"], "ans": 1, "exp": "蛇吞象——好大的胃口，是貪心。其他三個都是自找死路／自取滅亡。", "src": "課本 p.105 二-3"}, {"stem": "某篇社會新聞報導：「一名竊賊從員警家中偷走一輛名貴的腳踏車……一個月後，小偷竟然穿著同樣的衣服，到派出所找人聊天，員警一眼識破，當場逮捕。」文中小偷的行徑，最適合用哪一句歇後語來形容？", "opts": ["蒼蠅會蜘蛛", "兔子看人", "烏龜打架", "猴子穿新衣"], "ans": 0, "exp": "自己送上門被抓＝蒼蠅會蜘蛛——自投羅網。", "src": "課本 p.105 二-4"}, {"stem": "「少年風流的天子朱金龍，微服出巡途中在茶樓巧遇李彩鳳，驚為天人，既而展開熱烈追求。但彩鳳卻不解風情，再加上彩鳳之弟尚虎的百般刁難，皇帝不禁大嘆：『……』。」下列何者最可能為皇帝的感嘆之詞？", "opts": ["水牛走在象群中", "龍王的幫手", "龍困淺灘", "螃蟹過河"], "ans": 2, "exp": "皇帝是「龍」，微服出巡時無法用權力，有力使不上＝龍困淺灘——有力無處使。", "src": "課本 p.105 二-5"}]}, {"id": "chengyu", "title": "歇後語及成語對照", "items": [{"stem": "歇後語「烏龜爬門檻——但看此一翻」意義近似的成語是？", "opts": ["半斤八兩", "濫竽充數", "孤注一擲", "有眼無珠"], "ans": 2, "exp": "烏龜爬門檻，翻得過去或翻倒全看這一下，比喻把全部押上做最後一搏。", "src": "課本 p.105–106 一-1"}, {"stem": "歇後語「架上的黃鶯——唱得飛不得」意義近似的成語是？", "opts": ["旗鼓相當", "半斤八兩", "損人不利己", "懷才不遇"], "ans": 3, "exp": "黃鶯被關在架上，有好歌喉卻飛不出去，比喻有才能卻沒有發揮的機會。", "src": "課本 p.105–106 一-2"}, {"stem": "歇後語「惡狗擋路睡——人己兩不便」意義近似的成語是？", "opts": ["因禍得福", "濫竽充數", "損人不利己", "緣木求魚"], "ans": 2, "exp": "狗擋路，人過不去，狗也睡不好。", "src": "課本 p.105–106 一-3"}, {"stem": "歇後語「腰裡掛個老鼠皮——充混打獵的」意義近似的成語是？", "opts": ["懷才不遇", "濫竽充數", "有眼無珠", "旗鼓相當"], "ans": 1, "exp": "沒有本事卻混在裡面冒充。", "src": "課本 p.105–106 一-4"}, {"stem": "歇後語「龜兒不笑鱉——同個洞裡歇」意義近似的成語是？", "opts": ["有眼無珠", "因禍得福", "半斤八兩", "損人不利己"], "ans": 2, "exp": "住同一個洞，彼此差不多。", "src": "課本 p.105–106 一-5"}, {"stem": "歇後語「碼頭上釣大魚——落空」意義近似的成語是？", "opts": ["損人不利己", "有眼無珠", "緣木求魚", "光說不練"], "ans": 2, "exp": "方法錯誤，不可能達到目的。", "src": "課本 p.105–106 一-6"}, {"stem": "歇後語「蛇吃蛇——比比長短」意義近似的成語是？", "opts": ["損人不利己", "旗鼓相當", "有眼無珠", "緣木求魚"], "ans": 1, "exp": "彼此比較，勢均力敵。", "src": "課本 p.105–106 一-7"}, {"stem": "歇後語「口水多過茶——會說不會做」意義近似的成語是？", "opts": ["孤注一擲", "緣木求魚", "旗鼓相當", "光說不練"], "ans": 3, "exp": "只會說不會做。", "src": "課本 p.105–106 一-8"}, {"stem": "歇後語「塞翁失馬——焉知非福」意義近似的成語是？", "opts": ["懷才不遇", "因禍得福", "濫竽充數", "旗鼓相當"], "ans": 1, "exp": "壞事可能變好事。", "src": "課本 p.105–106 一-9"}, {"stem": "歇後語「隔門縫瞧諸葛亮——瞧扁了英雄」意義近似的成語是？", "opts": ["孤注一擲", "有眼無珠", "損人不利己", "旗鼓相當"], "ans": 1, "exp": "看不出別人的才能。", "src": "課本 p.105–106 一-10"}, {"stem": "「半空裡翻觔斗，不著實地」，這句歇後語與下列哪一個成語的意義相近？", "opts": ["藝高膽大", "騰雲駕霧", "好高騖遠", "腳踏實地"], "ans": 2, "exp": "不著實地＝不踏實、只想著高遠的目標＝好高騖遠。(D)意思相反。", "src": "課本 p.106 二-1"}, {"stem": "「破燈籠，別點了」，這句歇後語與下列哪一個成語的意義相近？", "opts": ["敝帚自珍", "陳腔濫調", "別有居心", "不明就裡"], "ans": 3, "exp": "破燈籠點了也不會亮，也就是「不明」，所以選「不明就裡」（不清楚內情）。類似的說法還有「牛皮燈籠——點極唔明」。", "src": "課本 p.106 二-2"}, {"stem": "「剃頭擔子」這句歇後語的意義和下列何者相近？", "opts": ["分道揚鑣", "一廂情願", "情投意合", "殊途同歸"], "ans": 1, "exp": "剃頭擔子——一頭熱：古時剃頭匠的擔子一頭放火爐燒熱水，另一頭放工具，只有一頭熱＝一廂情願。", "src": "課本 p.106 二-3"}]}, {"id": "zonghui", "title": "歇後語總匯", "items": [{"stem": "歇後語「瞎子吃湯圓」的含義是？", "opts": ["嫌命長", "推來推去", "心裡有數", "空掛名（明）"], "ans": 2, "exp": "看不見，但吃了多少湯圓心裡很清楚。", "src": "課本 p.106–107 一-1"}, {"stem": "歇後語「胡桃裡的肉」的含義是？", "opts": ["死不讓人", "挑出來吃的", "空掛名（明）", "不用謝"], "ans": 1, "exp": "胡桃核很硬，要敲開才挑得出肉，比喻要經過一番努力才有成就。", "src": "課本 p.106–107 一-2"}, {"stem": "歇後語「叫化子請客」的含義是？", "opts": ["挑出來吃的", "白費力", "空掛名（明）", "不用謝"], "ans": 3, "exp": "乞丐的食物是討來的，所以不必向他道謝。", "src": "課本 p.106–107 一-3"}, {"stem": "歇後語「酒樓的點心車」的含義是？", "opts": ["十八變", "也算內行", "推來推去", "有去無回"], "ans": 2, "exp": "點心車在餐廳裡推來推去，比喻互相推卸責任。", "src": "課本 p.106–107 一-4"}, {"stem": "歇後語「鬼打官司」的含義是？", "opts": ["心裡有數", "人家的", "死不讓人", "自身難保"], "ans": 2, "exp": "鬼已經死了還要爭，比喻態度強硬不退讓。", "src": "課本 p.106–107 一-5"}, {"stem": "歇後語「奶媽抱孩子」的含義是？", "opts": ["沒問題", "挑出來吃的", "用力不多", "人家的"], "ans": 3, "exp": "奶媽抱的是別人的孩子，比喻東西再好也不是自己的。", "src": "課本 p.106–107 一-6"}, {"stem": "歇後語「啞巴上學」的含義是？", "opts": ["用力不多", "心裡有數", "沒問題", "也算內行"], "ans": 2, "exp": "啞巴不能開口問問題，誇口自己一定辦得到。", "src": "課本 p.106–107 一-7"}, {"stem": "歇後語「稻草人救火」的含義是？", "opts": ["自身難保", "白費力", "沒問題", "挑出來吃的"], "ans": 0, "exp": "稻草遇火就燒，自己都保不住，和「泥菩薩過江」意思一樣。", "src": "課本 p.106–107 一-8"}, {"stem": "歇後語「黃梅天」的含義是？", "opts": ["挑出來吃的", "十八變", "空掛名（明）", "嫌命長"], "ans": 1, "exp": "黃梅天天氣陰晴不定，比喻人常改變主意。", "src": "課本 p.106–107 一-9"}, {"stem": "歇後語「順風吹火」的含義是？", "opts": ["自身難保", "不用謝", "用力不多", "嫌命長"], "ans": 2, "exp": "順著風勢吹火，不必花太多力氣。", "src": "課本 p.106–107 一-10"}, {"stem": "歇後語「月亮裡點燈」的含義是？", "opts": ["死不讓人", "也算內行", "沒問題", "空掛名（明）"], "ans": 3, "exp": "月亮已經很亮，再點燈是白費，「明」諧音「名」，比喻只重虛名。", "src": "課本 p.106–107 一-11"}, {"stem": "歇後語「壽星公吊頸」的含義是？", "opts": ["嫌命長", "自身難保", "有去無回", "人家的"], "ans": 0, "exp": "壽星已經長壽還上吊，比喻做事莽撞、自尋死路。", "src": "課本 p.106–107 一-12"}, {"stem": "歇後語「票友兒下海」的含義是？", "opts": ["也算內行", "空掛名（明）", "嫌命長", "心裡有數"], "ans": 0, "exp": "票友是業餘京劇演員，正式登台演出也表演得有模有樣。", "src": "課本 p.106–107 一-13"}, {"stem": "歇後語「肉包子打狗」的含義是？", "opts": ["有去無回", "挑出來吃的", "人家的", "也算內行"], "ans": 0, "exp": "包子一定被狗吃掉，比喻東西給出去就收不回來。", "src": "課本 p.106–107 一-14"}, {"stem": "歇後語「下水捉月」的含義是？", "opts": ["自身難保", "空掛名（明）", "白費力", "推來推去"], "ans": 2, "exp": "水中的月亮本來就抓不到。", "src": "課本 p.106–107 一-15"}, {"stem": "「小揚苦戀小綾多年，都沒能擄獲芳心。小綾曾多次拒絕，但小揚始終沒有放棄……今年情人節，小揚又送了九十九朵紅玫瑰表達愛意，沒想到竟換來一個晴天霹靂的消息：『小綾要結婚了。』小揚忍不住大嘆：『……』」刪節號處最適合填入下列何者？", "opts": ["稻草人救火", "胡桃裡的肉", "黃梅天", "下水捉月"], "ans": 3, "exp": "多年追求一場空＝下水捉月——白費力。", "src": "課本 p.107 二-1"}, {"stem": "「臺灣的升學壓力真的減輕了嗎？從補習班林立的情況來看，官員的說法似乎過分樂觀。全臺灣有多少學校真正做到五育並重，不特別重視升學？相信許多老師和家長都是……。」刪節號處適合填入哪一個歇後語？", "opts": ["鬼打官司", "瞎子吃湯圓", "順風吹火", "啞巴上學"], "ans": 1, "exp": "大家心裡都很清楚真相＝瞎子吃湯圓——心裡有數。", "src": "課本 p.108 二-2"}]}, {"id": "wanfeng", "title": "輕鬆完封大晉級：選擇題", "items": [{"stem": "「瞎子吃湯圓」這句歇後語的意義和下列何者相近？", "opts": ["胸有成竹", "不識之無", "有眼無珠", "有口無心"], "ans": 0, "exp": "瞎子吃湯圓——心裡有數，與「胸有成竹」（心中早有打算）相近。", "src": "課本 p.108 完封-1"}, {"stem": "「好萊塢目前最悲怒的女人應該非珍妮佛．安妮斯頓莫屬了！不僅老公布萊德．彼特成了別人的，就連自己本來要接的電影，都被人家搶走啦！……安潔莉娜．裘莉不但接收了珍妮佛的老公，這部讓珍妮佛扼腕的電影也成了她的戰利品。」下列哪一句歇後語最適合用來形容新聞中珍妮佛的遭遇？", "opts": ["呂布戲貂蟬", "周瑜打黃蓋", "關羽降曹操", "周瑜謀荊州"], "ans": 3, "exp": "丈夫和電影都被搶走、兩頭落空＝周瑜謀荊州——賠了夫人又折兵。", "src": "課本 p.108 完封-2"}, {"stem": "「丐幫幫主喬峰，原是個頂天立地的英雄鐵漢……後來因為種族衝突的緣故，一夕之間失去幫主職位，並成了□□□□。中原之大，再無他容身之處……」空格中應填入下列哪一個歇後語？", "opts": ["斑馬的腦袋", "龍王的幫手", "過街老鼠", "金魚尾巴"], "ans": 2, "exp": "「中原之大，再無他容身之處」＝過街老鼠——人人喊打。", "src": "課本 p.108 完封-3"}, {"stem": "「無照駕駛已經很不應該，陳姓男子肇事後竟然還駕車逃逸。為逃避法律追究，他不僅換了假車牌，還精心偽造一份賣車協議書，企圖嫁禍他人。最後經過警方鍥而不捨的追查，機關算盡的陳某只能乖乖俯首認罪。」下列有關這則社會新聞的評論，哪一個歇後語完全正確？", "opts": ["關雲長放屁——終究吃牢飯", "孫權殺關羽——嫁禍他人", "張飛拆橋——聰明反被聰明誤", "劉備摔孩子——回天乏術"], "ans": 1, "exp": "「企圖嫁禍他人」＝孫權殺關羽——嫁禍於人，前後都正確。(A)應為不知臉紅 (C)應為有勇無謀 (D)應為收買人心。", "src": "課本 p.108 完封-4"}, {"stem": "「泥菩薩過江」這句歇後語的意義和下列何者相近？", "opts": ["識時務者為俊傑", "明人不做暗事", "心有餘而力不足", "我不入地獄，誰入地獄"], "ans": 2, "exp": "泥菩薩過江——自身難保，想幫人也幫不了＝心有餘而力不足。", "src": "課本 p.108 完封-5"}, {"stem": "「小強一早搭計程車去機場，不料卻出了小車禍進醫院，害他錯過班機。晚上看新聞時他差點昏厥，原來他上午預計搭乘的班機竟然失事了，旅客全數罹難。僥倖逃過一劫的他安慰自己：『雖然我們不能預知未來，但仍應抱著樂觀的心態去面對逆境。』」下列哪一句歇後語最能形容小強的處境？", "opts": ["獨眼龍看戲", "放虎歸山", "熱鍋上的螞蟻", "塞翁失馬"], "ans": 3, "exp": "車禍（壞事）反而讓他逃過空難（好事）＝塞翁失馬——焉知非福。", "src": "課本 p.109 完封-6"}, {"stem": "大頭的歷史報告寫道：「唐高祖武德九年六月四日，其次子李世民……伏兵玄武門，發動政變，誅殺長兄建成、四弟元吉……史稱『玄武門之變』。」最適合用哪一個歇後語當作報告的題目？", "opts": ["魯肅上了孔明船", "煮豆燃豆萁", "孔明揮淚斬馬謖", "阿斗的江山"], "ans": 1, "exp": "兄弟相殘＝煮豆燃豆萁——自家人整自家人。", "src": "課本 p.109 完封-7"}, {"stem": "「一日，有黃、姜、秦、孫四位秀才共食。侍者送來一道美味撲鼻的辣子雞。四人均欲獨享。黃秀才說：『我是……。』言罷將雞盛入碗中。姜秀才說：『我是姜太公釣魚。』將黃秀才碗中之雞夾回自己碗中……」根據文意，文中黃秀才未完的話，最可能為下列何者？", "opts": ["瞎貓逮到死老鼠", "老虎嘴裡拔牙", "黃鼠狼咬烏龜", "黃鼠狼給雞拜年"], "ans": 3, "exp": "每位秀才都用和自己姓氏有關的話：姜→姜太公、秦→秦始皇、孫→孫悟空，黃秀才姓「黃」，又要把「雞」拿走＝黃鼠狼給雞拜年。", "src": "課本 p.109 完封-8"}, {"stem": "「溫莎公爵是英王喬治五世的長子。這位青年才俊遇到美國女孩辛普森，譜下了一段刻骨銘心的戀情。由於辛普森是平民，沒有資格成為王后，因此溫莎公爵放棄了江山，選擇與愛人長相廝守。」這段不愛江山愛美人的佳話，與下列哪一個歇後語傳達的意涵相近？", "opts": ["張飛繡花", "孔明彈琴退仲達", "看三國掉淚", "呂布戲貂蟬"], "ans": 3, "exp": "為美人放棄一切＝呂布戲貂蟬——英雄難過美人關。", "src": "課本 p.109 完封-9"}, {"stem": "「一月中旬，希臘貨輪阿瑪斯號在鵝鑾鼻外海觸礁，使得墾丁國家公園內特殊、稀有的『龍坑生態保護區』遭到油汙汙染……政府單位卻互推責任，使汙染擴大到難以收拾。」政府單位的行徑適合用下列哪一個歇後語形容？", "opts": ["肉包子打狗", "票友兒下海", "壽星公吊頸", "酒樓的點心車"], "ans": 3, "exp": "互推責任＝酒樓的點心車——推來推去。", "src": "課本 p.109 完封-10"}]}], "intro": "三國人物類、動物類歇後語，以及歇後語與成語對照、歇後語總匯。"}</script>
