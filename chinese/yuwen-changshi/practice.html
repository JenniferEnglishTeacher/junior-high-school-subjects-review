<script type="application/json" id="bank">{"id": "drill", "title": "搶鮮練習題", "eyebrow": "語文常識 · 單元 6", "intro": "60 題綜合練習：季節、韻文、作家與名著。", "sections": [{"id": "d1", "title": "詩詞中的季節（1–20）", "items": [{"stem": "「梅子黃時日日晴，小溪泛盡卻山行。綠陰不減來時路，添得黃鸝四五聲。」（曾幾〈三衢道中〉）關於這首詩的敘述何者正確？", "opts": ["韻腳是行、聲", "動詞有三個：行、減、添", "空間展現是室外之景", "描寫春季"], "ans": 2, "exp": "「梅子黃時」點出初夏，(D)錯；韻腳是晴、行、聲，(A)漏了「晴」；寫小溪、山路、綠陰、黃鸝，是室外景色。", "src": "搶鮮第 1 題"}, {"stem": "「遠上寒山石徑斜，白雲深處有人家。停車坐愛楓林晚，霜葉紅於二月花。」（杜牧〈山行〉）本詩描寫的是什麼時候的景象？", "opts": ["夏天傍晚", "春天早上", "秋天傍晚", "秋天早上"], "ans": 2, "exp": "「寒山」「霜葉」「楓林」點出秋天，「楓林晚」點出傍晚。", "src": "搶鮮第 2 題"}, {"stem": "甲女：「我最喜歡金風送爽的季節。」乙女：「我最欣賞滿池荷花的美景。」丙女：「聖誕節燃燒的景色最令人陶醉。」三女所喜愛的季節依序為何？", "opts": ["春夏秋", "秋夏冬", "夏秋冬", "冬春夏"], "ans": 1, "exp": "金風＝秋；荷花＝夏；聖誕節燃燒的景色＝聖誕紅，冬天。", "src": "搶鮮第 3 題"}, {"stem": "袁枚〈祭妹文〉：「朔風野大，阿兄歸矣。」下列何選項詩句所呈現的季節與本句相同？", "opts": ["夜深知雪重，時聞折竹聲", "天邊金掌露成霜，雲隨雁字長", "紅杏枝頭春意鬧，綠楊煙外曉雲輕", "新竹壓簷桑四圍，小齋幽敞明朱曦"], "ans": 0, "exp": "「朔風」＝北風，冬天。(A)夜深雪重、竹子被壓折＝冬；(B)露成霜、雁＝秋；(C)紅杏＝春；(D)新竹＝夏。", "src": "搶鮮第 4 題"}, {"stem": "念念喜愛在「鳳凰花開」的季節出遊，她最有可能看到下列哪一種景象？", "opts": ["碧雲天，黃葉地", "天山雪後海風寒，橫笛遍吹行路難", "沾衣欲溼杏花雨，吹面不寒楊柳風", "漠漠水田飛白鷺，陰陰夏木囀黃鸝"], "ans": 3, "exp": "鳳凰花開在夏天（畢業季）。(D)「陰陰夏木囀黃鸝」直接點出夏；(A)黃葉＝秋；(B)雪後＝冬；(C)杏花、楊柳＝春。", "src": "搶鮮第 5 題"}, {"stem": "「清風徐來，水波不興」是蘇軾在〈赤壁賦〉中描寫秋季月夜泛舟的景象，下列何者與其季節相同？", "opts": ["過雨荷花滿院香，沉李浮瓜冰雪涼", "鶯啼燕語報新年，馬邑龍堆路幾千", "百花過盡綠陰成，漠漠爐香睡晚晴", "叢菊兩開他日淚，孤舟一繫故園情"], "ans": 3, "exp": "〈赤壁賦〉寫秋季。(D)叢菊兩開（杜甫〈秋興〉）＝秋；(A)荷花、沉李浮瓜＝夏；(B)新年＝春；(C)百花過盡綠陰成＝初夏。", "src": "搶鮮第 6 題"}, {"stem": "下列各項所描述的季節，何者不正確？", "opts": ["明月照積雪，北風勁且哀—冬", "芳菊開林耀，青松冠巖列—春", "金風細細，葉落梧桐墜—秋", "凱風自南，吹彼棘心—夏"], "ans": 1, "exp": "「芳菊開林耀，青松冠巖列」寫秋菊盛開，屬秋季，不是春季。", "src": "搶鮮第 7 題"}, {"stem": "每個季節都有特殊的代表事物，下列哪一項不屬於夏天的特徵？", "opts": ["蟬", "海棠", "螢火蟲", "牡丹"], "ans": 1, "exp": "海棠是春天的花；蟬、螢火蟲、牡丹（題中列為夏）屬夏季特徵。", "src": "搶鮮第 8 題"}, {"stem": "下列詞句所指季節，何者和「月明全見蘆花白，風起遙聞杜若香」相同？", "opts": ["數點梅花天地心", "新筍已成堂下竹", "起弄明月霜天高", "二月初驚見草芽"], "ans": 2, "exp": "蘆花白＝秋。(C)「霜天高」＝秋；(A)梅花＝冬；(B)新筍成竹＝夏；(D)二月草芽＝春。", "src": "搶鮮第 9 題"}, {"stem": "下列選項所表示的時序，何者不是夏季？", "opts": ["桃之夭夭，灼灼其華", "明月別枝驚鵲，清風半夜鳴蟬", "稻花香裡說豐年，聽取蛙聲一片", "惟有南風舊相識，偷開門戶又翻書"], "ans": 0, "exp": "「桃之夭夭，灼灼其華」寫桃花盛開，是春季。其他：蟬、蛙聲、南風皆夏。", "src": "搶鮮第 10 題"}, {"stem": "下列各選項中的詩句所描寫的季節，何者正確？", "opts": ["千門萬戶曈曈日，總把新桃換舊符—春天", "日暮東風怨啼鳥，落花猶似墜樓人—夏天", "直須看盡洛城花，始共東風容易別—秋天", "細細香風淡淡煙，競收桂子慶豐年—冬天"], "ans": 0, "exp": "(A)「新桃換舊符」寫過年，春天正確。(B)東風、落花＝春；(C)洛城花、東風＝春；(D)桂子＝秋。", "src": "搶鮮第 11 題"}, {"stem": "「銀河清淺，玉露微茫。亙鵲橋於長空，渡天孫於碧落。」這闋詞的季節，與下列哪一選項相同？", "opts": ["寒蟬淒切，對長亭晚，驟雨初歇", "一翦寒梅傲立雪中，天地一片蒼茫", "梅子留酸濺齒牙，芭蕉分綠上窗紗", "向人嬌杏花，撲人衣柳花，迎人笑桃花"], "ans": 0, "exp": "銀河、鵲橋、天孫（織女）＝七夕，秋天。(A)寒蟬淒切＝秋。", "src": "搶鮮第 12 題"}, {"stem": "下列關於季節的描述，何者錯誤？", "opts": ["小娃撐小艇，偷採白蓮回—春", "林表明霽色，城中增暮寒—冬", "千里鶯啼綠映紅，水村山郭酒旗風—春", "六出飛花入戶時，坐看青竹變瓊枝—冬"], "ans": 0, "exp": "「偷採白蓮回」寫採蓮，屬夏季，不是春季。", "src": "搶鮮第 13 題"}, {"stem": "下列詩句所指的季節，何者與其他選項不同？", "opts": ["金風敵殘暑，玉鏡破雲層", "落紅滿路無人惜，踏作花泥透腳香", "沖天香陣透長安，滿城盡帶黃金甲", "郊外黃花一叢叢，自生自長西風中"], "ans": 1, "exp": "(B)落紅（落花）滿路＝春；其他：金風、菊花香陣（滿城黃金甲）、黃花西風皆為秋。", "src": "搶鮮第 14 題"}, {"stem": "「二月有□之夭夭／六月有□之灩灩／九月有□之澹澹／臘月有□之凜凜……」（向明〈花神的接力〉）□中依時令判斷，應依序填上什麼花？", "opts": ["桃荷菊梅", "桃荷菊蘭", "荷菊梅蘭", "梅蘭竹菊"], "ans": 0, "exp": "二月桃花、六月荷花、九月菊花、臘月梅花。", "src": "搶鮮第 15 題"}, {"stem": "下列選項，何者描寫的是春日的景象？", "opts": ["梨花院落溶溶月，柳絮池塘淡淡風", "昨夜庭前葉有聲，籬豆花開蟋蟀鳴", "一年好景君須記，最是橙黃橘綠時", "四月又五月，更盼分龍雨"], "ans": 0, "exp": "梨花、柳絮＝春。(B)蟋蟀＝秋；(C)橙黃橘綠＝秋末冬初；(D)四月五月＝夏。", "src": "搶鮮第 16 題"}, {"stem": "李珣〈南鄉子〉：「乘彩舫，過蓮塘，棹歌驚起睡鴛鴦。」此詩所描述的季節與下列何者相同？", "opts": ["人閒桂花落，夜靜春山空", "涉江采芙蓉，蘭澤多芳草", "白髮催年老，青陽逼歲除", "露從今夜白，月是故鄉明"], "ans": 1, "exp": "過蓮塘＝夏。(B)采芙蓉（荷花）＝夏；(A)「春山空」＝春；(C)歲除＝冬；(D)露從今夜白＝秋（白露）。", "src": "搶鮮第 17 題"}, {"stem": "下列各組詩句中所描寫的季節，何者與其他三選項不同？", "opts": ["水滿有時觀下鷺，草深無處不鳴蛙", "無邊落木蕭蕭下，不盡長江滾滾來", "水晶簾動微風起，滿架薔薇一院香", "更無柳絮因風起，惟有葵花向日傾"], "ans": 1, "exp": "(B)無邊落木蕭蕭下＝秋；其他：鳴蛙、薔薇、葵花向日皆夏。", "src": "搶鮮第 18 題"}, {"stem": "張養浩〈水仙子·詠江南〉：「一江煙水照晴嵐，兩岸人家接畫簷，芰荷叢一段秋光淡，看沙鷗舞再三，捲香風十里珠簾。畫船兒天邊至，酒旗兒風外颭。愛殺江南。」其中「芰荷叢一段秋光淡」的季節，與下列何者不同？", "opts": ["青山綠水，白草紅葉黃花", "楓葉蘆花兩鬢霜，櫻桃楊柳久相忘", "殘花醞釀蜂兒蜜，細雨調和燕子泥", "金風颯颯霜葉冷，銀河耿耿夜色清"], "ans": 2, "exp": "「芰荷叢一段秋光淡」＝秋。(C)殘花、燕子泥＝春；其他：紅葉黃花、楓葉蘆花、金風皆秋。", "src": "搶鮮第 19 題"}, {"stem": "下列哪一句□內應填的季節和其他三者不同？", "opts": ["綠樹陰濃□日長", "□色滿園關不住", "竹外桃花三兩枝，□江水暖鴨先知", "□風又綠江南岸"], "ans": 0, "exp": "(A)綠樹陰濃「夏」日長；(B)春色滿園；(C)春江水暖；(D)春風又綠江南岸——三者皆春。", "src": "搶鮮第 20 題"}]}, {"id": "d2", "title": "韻文常識（21–38）", "items": [{"stem": "李白〈春思〉：「燕草如碧絲，秦桑低綠枝；當君懷歸日，是妾斷腸時。春風不相識，何事入羅幃？」有關這首詩的說明，下列何者正確？", "opts": ["五言古詩", "韻腳是枝、時、幃", "詩中無對句", "末句使用提問法"], "ans": 0, "exp": "〈春思〉六句，不合絕句、律詩，是五言古詩。韻腳是絲、枝、時、幃（首句入韻），(B)不完整；「燕草如碧絲，秦桑低綠枝」是對句，(C)錯。", "src": "搶鮮第 21 題"}, {"stem": "「白日依山盡，黃河入海流」其中「入海流」不能寫成「流入海」，下列哪一項是最重要的理由？", "opts": ["押韻", "平仄合律", "對仗工整", "字數"], "ans": 0, "exp": "〈登鸛雀樓〉韻腳是「流」「樓」，「入海流」才能押韻。", "src": "搶鮮第 22 題"}, {"stem": "「旅館無良伴，凝情自悄然。『寒燈思舊事（甲），遠夢歸侵曉（乙），滄江好煙月（丙），家書到隔年（丁），斷雁警愁眠（戊）』，門繫釣魚船。」以上是杜牧的五律，第三至七句順序混淆了，下列何者還原正確？", "opts": ["甲丁乙戊丙", "丙戊丁甲乙", "甲戊乙丁丙", "丙丁戊甲乙"], "ans": 2, "exp": "律詩頷聯、頸聯須對仗：寒燈思舊事／斷雁警愁眠，遠夢歸侵曉／家書到隔年；第七句「滄江好煙月」接尾句。", "src": "搶鮮第 23 題"}, {"stem": "有關「近體詩」和「詞」的比較，下列敘述何者正確？", "opts": ["詞產生較晚又叫詞餘", "兩者皆合樂而唱皆稱樂府", "近體詩一定要對仗，詞不可對仗", "近體詩一韻到底，詞有轉韻情形"], "ans": 3, "exp": "近體詩一韻到底不可換韻，詞有轉韻情形。(A)詞餘是曲的別稱；(B)近體詩不合樂；(C)詞也可以對仗。", "src": "搶鮮第 24 題"}, {"stem": "陳子昂〈登幽州臺歌〉：「前不見古人，後不見來者。念天地之悠悠，獨愴然而涕下。」以下敘述何者正確？", "opts": ["「者」「下」是韻腳", "絕句", "有兩組對句", "詩眼是「念」"], "ans": 0, "exp": "「者」「下」在古音押韻，是韻腳。這首是雜言古詩，不是絕句；只有「前不見古人，後不見來者」一組對句。", "src": "搶鮮第 25 題"}, {"stem": "關於「雜劇」和「散曲」的敘述，以下何者正確？", "opts": ["散曲是元代新詩，分散套和套數", "散套是同宮調小令組合，可以轉韻", "雜劇是元代歌劇，含唱詞、唱曲、科、白", "科、白指臺上道具和開場白"], "ans": 2, "exp": "雜劇是元代歌劇，由曲（唱詞）、科（動作）、白（說白）組成。(A)散曲分小令與散套；(B)散套一韻到底不能轉韻；(D)科是動作、白是說白。", "src": "搶鮮第 26 題"}, {"stem": "柏之是唐朝的文人，請問他不可能創作何種文學作品？", "opts": ["辭賦", "樂府", "近體詩", "雜劇"], "ans": 3, "exp": "雜劇是元代才興起的戲劇，唐朝人不可能創作。", "src": "搶鮮第 27 題"}, {"stem": "「梳洗罷，獨倚望江樓。過盡千帆皆不是，斜暉脈脈水悠悠。腸斷白蘋洲。」（溫庭筠〈望江南〉）下列有關這闋詞的說明，何者正確？", "opts": ["五句二十七字屬中調", "詞牌名與內容有關屬緣題作賦", "詞又叫長短句，這闋詞符合這種句式", "韻腳樓悠洲，可見詞不能轉韻"], "ans": 2, "exp": "這闋詞句式三、五、七、七、五，長短不齊，符合「長短句」。27 字屬小令；韻腳相同只說明這闋沒轉韻，不能推論「詞不能轉韻」。", "src": "搶鮮第 28 題"}, {"stem": "國文老師介紹元曲後，舉馬致遠〈天淨沙〉為例：「枯藤老樹昏鴉。小橋流水人家。古道西風瘦馬。夕陽西下。斷腸人在天涯。」請在下列四首散曲中找出另一首「天淨沙」：", "opts": ["鶯鶯燕燕春春，花花柳柳真真，事事風風韻韻。嬌嬌嫩嫩，停停當當人人", "百歲光陰一夢蝶，重回首往事堪嗟。今日春來，明朝花謝。急罰盞夜闌燈滅", "劉伶不戒，靈均休怪，沿村沽酒尋常債。看梅開，過橋來，青旗正在疏籬外。醉和古人安在哉？窄，不夠篩，哎，我再買", "半窗幽夢微茫，歌罷錢塘，賦罷高唐。風入羅幃，爽入疏櫺，月照紗窗。縹緲見、梨花淡妝，依稀聞、蘭麝餘香。喚起思量，待不思量，怎不思量"], "ans": 0, "exp": "〈天淨沙〉句式為六、六、六、四、六。(A)「鶯鶯燕燕春春……」完全相同，是喬吉的〈天淨沙〉。", "src": "搶鮮第 29 題"}, {"stem": "關於「新體詩」與「近體詩」的比較，以下何者正確？", "opts": ["前者興起於唐朝以後", "後者又稱自由詩", "二者都有用典要求", "新體詩用韻較自由"], "ans": 3, "exp": "新體詩（現代詩）用韻較自由。(A)新詩興起於民國；(B)自由詩是新詩的別稱；(C)新詩沒有用典要求。", "src": "搶鮮第 30 題"}, {"stem": "下列是小吉所整理的韻文常識，請找出何項有誤？", "opts": ["詞、曲皆可配樂而唱，又稱樂府", "古詩、唐詩、宋詞、元曲合稱四大韻文", "古詩和詞可以轉韻，近體詩和曲須一韻到底", "四大韻文中唐詩句式整齊，其餘三種有長短不齊"], "ans": 1, "exp": "四大韻文一般指「漢賦、唐詩、宋詞、元曲」，不是「古詩」。", "src": "搶鮮第 31 題"}, {"stem": "唐詩多抒情，宋詩重說理。下列哪一首詩有較明顯的說理意味？", "opts": ["橫看成嶺側成峰，遠近高低各不同。不識廬山真面目，只緣身在此山中（蘇軾〈題西林壁〉）", "梅子流酸濺齒牙，芭蕉分綠上窗紗。日長睡起無情思，閒看兒童捉柳花（楊萬里〈初夏睡起〉）", "黃梅時節家家雨，青草池塘處處蛙。有約不來過夜半，閒敲棋子落燈花（趙師秀〈有約〉）", "死去原知萬事空，但悲不見九州同。王師北定中原日，家祭毋忘告乃翁（陸游〈示兒〉）"], "ans": 0, "exp": "〈題西林壁〉從看山的經驗推出「身在其中反而看不清全貌」的道理，說理意味最明顯。", "src": "搶鮮第 32 題"}, {"stem": "蘇軾詩：「水光瀲灩晴方好，山色空濛雨亦奇。欲把西湖比西子，淡妝濃抹總相宜。」下列有關這首詩的敘述，何者正確？", "opts": ["西子指西施", "作者認為晴湖不如雨湖", "本詩為平起仄聲韻", "詩中無對句"], "ans": 0, "exp": "「欲把西湖比西子」：西子即春秋越國美女西施。首句「光」平聲→平起；韻腳奇、宜為平聲韻；作者認為晴、雨皆美。", "src": "搶鮮第 33 題"}, {"stem": "以下有關「詞」的敘述，何者正確？", "opts": ["因沒有固定形式又稱長短句", "單位是「闋」，可見與音樂有關", "詞調又稱詞牌，可看出文章主題", "產生於宋朝所以稱宋詞"], "ans": 1, "exp": "詞的單位是「闋」（原為音樂終了之意），可見詞與音樂有關。(A)詞有固定格式；(C)詞牌與內容多無關；(D)詞起於唐。", "src": "搶鮮第 34 題"}, {"stem": "就近體詩的格律而言，下列各選項的詩句，何者不可能是律詩的頷、頸二聯？", "opts": ["潮平兩岸闊，風正一帆懸。海日生殘夜，江春入舊年", "露從今夜白，月是故鄉明。有弟皆分散，無家問死生", "還家萬里夢，為客五更愁。不用開書帙，偏宜上酒樓", "相攜及田家，童稚開荊扉。綠竹入幽徑，青蘿拂行衣"], "ans": 3, "exp": "(D)「相攜及田家，童稚開荊扉」上下句沒有對仗，不可能是律詩的頷聯。", "src": "搶鮮第 35 題"}, {"stem": "在寫曲時，可添字於曲譜應有字數之外，用以補足語氣或描摹情態。下列關於「襯字」的敘述，何者有誤？", "opts": ["不能加在句末", "通常是非關鍵性字詞", "對句所加襯字詞性也要相對", "隨興而加，字數多寡不拘"], "ans": 3, "exp": "襯字不宜太多，並非隨興添加、字數不拘。", "src": "搶鮮第 36 題"}, {"stem": "唐代詩人王維為山水田園派之代表詩人。依其詩作風格，下列何首應是他的作品？", "opts": ["飲馬渡秋水，水寒風似刀。平沙日未沒，黯黯見臨洮。昔日長城戰，咸言意氣高。黃塵足今古，白骨亂蓬蒿", "寒山轉蒼翠，秋水日潺湲。倚杖柴門外，臨風聽暮蟬。渡頭餘落日，墟里上孤煙。復值接輿醉，狂歌五柳前", "昔聞洞庭水，今上岳陽樓。吳楚東南坼，乾坤日夜浮。親朋無一字，老病有孤舟。戎馬關山北，憑軒涕泗流", "高閣客竟去，小園花亂飛。參差連曲陌，迢遞送斜暉。腸斷未忍掃，眼穿仍欲歸。芳心向春盡，所得是沾衣"], "ans": 1, "exp": "(B)「倚杖柴門外，臨風聽暮蟬……狂歌五柳前」寫山居田園閒適生活，是王維〈輞川閒居贈裴秀才迪〉。(A)邊塞；(C)杜甫〈登岳陽樓〉；(D)李商隱〈落花〉。", "src": "搶鮮第 37 題"}, {"stem": "「詞牌」的名稱若與內容符合，稱為「緣題作賦」。請判斷下列作品何者為緣題作賦？", "opts": ["晏殊〈浣溪沙〉一曲新詞酒一杯", "秦觀〈浣溪沙〉漠漠輕寒上小樓", "李煜〈菩薩蠻〉花明月黯飛輕霧", "李白〈憶秦娥〉簫聲咽，秦娥夢斷秦樓月"], "ans": 3, "exp": "〈憶秦娥〉內容寫秦娥夢斷秦樓月，詞牌名與內容相符，屬緣題作賦。", "src": "搶鮮第 38 題"}]}, {"id": "d3", "title": "作家與名著（39–60）", "items": [{"stem": "仁智要交一份研究李白作品的報告，下列何者無法提供相關資訊？", "opts": ["唐詩三百首", "全唐文", "李太白詩文集", "大唐西域記"], "ans": 3, "exp": "《大唐西域記》是唐玄奘口述西行求法見聞的地理書，與李白作品無關。", "src": "搶鮮第 39 題"}, {"stem": "夔兒看完電視劇「大秦帝國」後，想更了解秦始皇的為人與事蹟，你會推薦他參閱哪一本書？", "opts": ["三國志", "後漢書", "尚書", "戰國策"], "ans": 3, "exp": "《戰國策》記戰國至楚漢之際的史事，包含秦國史事；三國志、後漢書時代不符，尚書記上古。", "src": "搶鮮第 40 題"}, {"stem": "「官跡渺難尋，只博得三傑一門，前無古，後無今，器識文章，浩若江河行大地。」由文意推敲，所指的是哪三位傑出人物？", "opts": ["班彪班固班超", "蘇洵蘇軾蘇轍", "曹操曹丕曹植", "曾晳曾參曾申"], "ans": 1, "exp": "「三傑一門」「器識文章，浩若江河」：蘇洵、蘇軾、蘇轍父子三人，同列唐宋古文八大家。", "src": "搶鮮第 41 題"}, {"stem": "下列關於孔子的敘述，何者正確？", "opts": ["有教無類可見教育方法一致", "人不知而不慍足見求知欲", "三人行必有我師焉，可知其好為人師", "遇見穿喪服的人必定變容，可看出孔子充滿惻隱之心"], "ans": 3, "exp": "「見齊衰者，雖狎必變」，看到穿喪服的人必定改變神色，可見其惻隱之心。(C)「三人行必有我師」表現虛心好學，不是好為人師。", "src": "搶鮮第 42 題"}, {"stem": "盈君的老師要求閱讀描述臺灣風土人情的文學作品，以下哪一本書不符合她的需求？", "opts": ["陳黎散文選", "徐志摩全集", "吳晟農婦", "鍾理和全集"], "ans": 1, "exp": "徐志摩是浙江海寧人，作品多寫留學生活與愛情，不以臺灣風土人情為主。", "src": "搶鮮第 43 題"}, {"stem": "關於古人的「名」、「字」、「號」，下列何者有誤？", "opts": ["名字多有關聯，如端木賜字子貢為相反義", "女子已許婚才取字，待字閨中指未婚", "請問臺甫意思是請問您的字", "名、字、號皆父親或長輩所取"], "ans": 3, "exp": "「號」多為自己所取（如五柳先生、東坡居士），不一定是長輩所取。", "src": "搶鮮第 44 題"}, {"stem": "下列何者不是致力於社會寫實作品的代表詩人？", "opts": ["元稹", "杜甫", "孟浩然", "白居易"], "ans": 2, "exp": "孟浩然是盛唐山水田園詩人；元稹、白居易、杜甫都以社會寫實著稱。", "src": "搶鮮第 45 題"}, {"stem": "有關儒家的敘述，下列何者正確？", "opts": ["起源於道家", "孔子、孟子、荀子是代表人物", "論語大學中庸禮記合稱四書", "孔子思想以兼愛為中心"], "ans": 1, "exp": "儒家代表人物是孔子、孟子、荀子。(A)儒家非源於道家；(C)四書是論語、孟子、大學、中庸；(D)兼愛是墨家。", "src": "搶鮮第 46 題"}, {"stem": "選舉期間，甲候選人主張整頓治安、加重刑罰；乙候選人主張加強弱勢照顧，使「老有所終」、「幼有所長」；丙候選人主張減少稅賦、避免擾民，讓人民安居樂業；丁候選人主張婚喪喜慶儉約，節省不必要的浪費。若與先秦諸子各家對照，何者較合理？", "opts": ["甲—道家", "乙—儒家", "丙—墨家", "丁—法家"], "ans": 1, "exp": "「老有所終，幼有所長」出自《禮記·禮運·大同》，屬儒家。(A)加重刑罰＝法家；(C)減稅不擾民近道家；(D)節儉近墨家。", "src": "搶鮮第 47 題"}, {"stem": "楚濂想編一本名為「采菊東籬話田園」的詩集，以下何人的作品比較不適合放入此書？", "opts": ["王維", "孟浩然", "陶淵明", "王之渙"], "ans": 3, "exp": "王之渙是盛唐邊塞詩人（〈涼州詞〉），不寫田園；王維、孟浩然、陶淵明都寫田園。", "src": "搶鮮第 48 題"}, {"stem": "下列哪一段史事，可以在史記的「列傳」部分查到？", "opts": ["荊軻刺秦王", "劉邦赴鴻門宴", "秦始皇修築長城", "孔子興學"], "ans": 0, "exp": "荊軻刺秦王見於〈刺客列傳〉。(B)鴻門宴在〈項羽本紀〉；(C)秦始皇在〈秦始皇本紀〉；(D)孔子在〈孔子世家〉。", "src": "搶鮮第 49 題"}, {"stem": "之助乘坐時光機器回到東晉哀帝年間，看到一位背影極像陶淵明的路人，喊什麼名號不會引起陶淵明的注意和回應？", "opts": ["陶淵明", "陶潛", "陶元亮", "靖節先生"], "ans": 3, "exp": "「靖節」是陶淵明死後友人給的私諡，他生前沒有人這樣稱呼他。", "src": "搶鮮第 50 題"}, {"stem": "「出身望族，自幼聰穎，並著書暴露知識分子的醜態」、「曾任太史令，所著史記為我國第一部紀傳體通史」、「元曲四大家之一，作品風格以豪放為主，另著有雜劇漢宮秋、青衫淚等十餘種」。根據以上線索，其所述依序為哪三位作家？", "opts": ["王冕／司馬光／歐陽脩", "吳敬梓／司馬遷／馬致遠", "吳敬梓／司馬光／關漢卿", "歐陽脩／司馬遷／張養浩"], "ans": 1, "exp": "揭露知識分子醜態＝吳敬梓（儒林外史）；著史記＝司馬遷；漢宮秋、青衫淚＝馬致遠。", "src": "搶鮮第 51 題"}, {"stem": "蘇軾曾坦言自己比不上王安石的「博覽群書」。下列哪一部著作是王安石不可能看過的？", "opts": ["世說新語", "李太白詩文集", "楚辭", "漱玉詞"], "ans": 3, "exp": "《漱玉詞》是南宋李清照的作品，王安石（北宋）不可能看過。", "src": "搶鮮第 52 題"}, {"stem": "下列作家中，何者同時以新詩和散文享譽文壇？", "opts": ["徐志摩", "梁實秋", "梁啟超", "羅家倫"], "ans": 0, "exp": "徐志摩新詩、散文都享有盛名；梁實秋以散文為主，梁啟超為學者、政論家。", "src": "搶鮮第 53 題"}, {"stem": "下列何人的作品並非以充滿愛國意識著稱？", "opts": ["岳飛", "屈原", "辛棄疾", "周敦頤"], "ans": 3, "exp": "周敦頤是北宋理學家，以〈愛蓮說〉、《太極圖說》聞名；岳飛、屈原、辛棄疾皆以愛國著稱。", "src": "搶鮮第 54 題"}, {"stem": "如果想到圖書館借閱具寓言性質的作品，下列哪一本書應列為優先選擇？", "opts": ["韓非子", "論語", "老子", "聊齋"], "ans": 0, "exp": "《韓非子》多以歷史故事寫寓言（如守株待兔、自相矛盾）。", "src": "搶鮮第 55 題"}, {"stem": "如果請作家到學校作「臺灣鄉土文學」專題演講，下列人物與講題的配合，何者不適合？", "opts": ["吳晟—吾鄉印象", "琦君—三更有夢書當枕", "洪醒夫—懷念那聲鑼", "鍾理和—客家人的精神"], "ans": 1, "exp": "琦君是浙江永嘉人，作品多懷念大陸故鄉童年，不屬臺灣鄉土文學。", "src": "搶鮮第 56 題"}, {"stem": "「孔明借東風」／「孫悟空大戰鐵扇公主」／「林沖夜奔」／「王冕力學」，以上四個故事依序分別記錄在哪些章回小說中？", "opts": ["水滸西遊金瓶梅三國", "三國水滸西遊儒林", "水滸三國西遊儒林", "三國西遊水滸儒林"], "ans": 3, "exp": "孔明借東風＝三國演義；孫悟空＝西遊記；林沖＝水滸傳；王冕＝儒林外史。", "src": "搶鮮第 57 題"}, {"stem": "下列哪一項典故，不是出自三國演義？", "opts": ["既生瑜何生亮", "臥薪嘗膽", "扶不起的阿斗", "三顧茅廬"], "ans": 1, "exp": "臥薪嘗膽是春秋時越王句踐的故事，不在三國演義中。", "src": "搶鮮第 58 題"}, {"stem": "下列選項中對人物和著作的敘述，何項有誤？", "opts": ["史記是第一部紀傳體史書", "孔孟皆曾周遊天下", "老殘遊記以寫景名著，主角是殘而不廢的行醫者", "西遊記是諷刺小說也是神怪小說"], "ans": 2, "exp": "老殘是作者劉鶚的化身（自況），並不是身體殘廢的人。", "src": "搶鮮第 59 題"}, {"stem": "古代文人常因交情甚篤或風格接近而並稱，以下有關文人並稱的說明，何者正確？", "opts": ["王孟，中唐山水田園", "蘇辛，宋詞豪放派", "元白，晚唐社會詩人", "李杜，盛唐浪漫派"], "ans": 1, "exp": "蘇軾、辛棄疾並稱「蘇辛」，同為宋詞豪放派。(A)王孟是盛唐；(C)元白是中唐；(D)李白浪漫，杜甫寫實。", "src": "搶鮮第 60 題"}]}]}</script>
