<script type="application/json" id="bank">{"id": "exam", "title": "會考基測題庫", "eyebrow": "語文常識 · 單元 5", "intro": "歷屆會考、基測語文常識相關試題 31 題。", "sections": [{"id": "e1", "title": "詩詞賞析與季節", "items": [{"stem": "下列詩句，何者與「亂花漸欲迷人眼，淺草纔能沒馬蹄」所描述的季節相同？", "opts": ["金風扇微涼，遠煙凝翠晶", "樓倚霜樹外，鏡天無一毫", "隨風柳絮輕，映日杏花明", "黃葉覆溪橋，荒村惟古木"], "ans": 2, "exp": "題幹「亂花」「淺草」寫春景（白居易〈錢塘湖春行〉）。(C)柳絮、杏花＝春；(A)金風＝秋；(B)霜樹＝秋；(D)黃葉＝秋。", "src": "會考第 1 題"}, {"stem": "「思量、能幾許？憂愁風雨，一半相妨。又何須，抵死說短論長。幸對清風皓月，苔茵展、雲幕高張。江南好，千鍾美酒，一曲滿庭芳。」作者在這段文字中展現出的生命態度，與下列何者最接近？", "opts": ["生於憂患死於安樂", "隱遁出世成道求仙", "豁達自適及時行樂", "縱論時局憂以天下"], "ans": 2, "exp": "「幸對清風皓月……千鍾美酒，一曲滿庭芳」：不必爭長論短，享受眼前的美景美酒，是豁達自適、及時行樂（蘇軾〈滿庭芳〉）。", "src": "會考第 2 題"}, {"stem": "「呵凍提篙手未蘇（雙手尚未活絡），滿船涼月雪模糊。畫家不解漁家苦，好作寒江釣雪圖。」本詩的主旨與下列何者最接近？", "opts": ["對漁民生活疾苦寄予關切同情", "漁民雖艱辛卻苦中作樂", "畫家擅從藝術角度捕捉漁民閒情逸趣", "畫家以寫實筆法呈現漁民甘苦"], "ans": 0, "exp": "後兩句「畫家不解漁家苦，好作寒江釣雪圖」：畫家只看見雪景之美，作者卻點出漁民在嚴寒中的辛苦，寄予同情。", "src": "會考第 3 題"}, {"stem": "白居易〈題山石榴花〉：「一叢千朵壓闌干，剪碎紅綃卻作團。風嫋舞腰香不盡，露銷妝臉淚新乾。薔薇帶刺攀應懶，菡萏（荷花）生泥玩亦難。爭及（哪裡比得上）此花檐戶下，任人採弄盡人看。」下列關於這首詩的說明，何者錯誤？", "opts": ["剪碎紅綃卻作團—描寫花形態", "露銷妝臉淚新乾—描寫賞花人心緒神態", "薔薇帶刺攀應懶—薔薇有刺使人懶於採摘", "菡萏生泥玩亦難—荷花長於淤泥不易親近"], "ans": 1, "exp": "「露銷妝臉淚新乾」是以擬人手法寫花上露水消散，仍在描寫花，不是寫賞花人的心緒。", "src": "會考第 4 題"}, {"stem": "李白〈送別〉：「斗酒渭城邊，壚頭（酒店）醉不眠。梨花千樹雪，楊葉萬條煙。惜別傾壺醑（美酒），臨分贈馬鞭。看君潁上去，新月到應圓。」關於本詩的分析，下列敘述何者錯誤？", "opts": ["首聯點出送別之地，末聯點出友人將往之處", "藉飲酒寬慰離愁，珍惜離別前時刻", "梨花喻雪、楊葉喻煙，烘托宴飲愉悅", "由末聯可看出友人到潁地約需半個月"], "ans": 2, "exp": "「梨花千樹雪，楊葉萬條煙」是以雪喻梨花、以煙喻楊葉，寫送別時的春景，不是烘托宴飲愉悅；(D)出發時是新月，到達時月圓，約半個月。", "src": "會考第 5 題"}, {"stem": "「鏡破留餘光，蘭死留餘香。」這句話的含義，與下列何者最接近？", "opts": ["哲人日已遠，青史字不泯", "窮冬百草死，幽桂乃芬芳", "曾陪桃李開時雨，仍伴梧桐落後風", "時人不識凌雲木，直待凌雲始道高"], "ans": 0, "exp": "鏡破仍有餘光、蘭死仍留餘香：人雖逝去，美好的德行仍流傳。(A)哲人已遠，事蹟仍留在史冊，意思最接近。", "src": "會考第 6 題"}, {"stem": "阿輝下載一首五言律詩，排版時把中間四句打亂了，只知首末兩聯各是「沙岸殘春雨，茅簷古鎮官」、「惜無陶謝手，盡日破憂端」。依律詩常識，下列哪一種組合正確？", "opts": ["一時花帶淚，萬里客憑欄。日晚薔薇重，樓高燕子寒", "樓高燕子寒，一時花帶淚。日晚薔薇重，萬里客憑欄", "日晚薔薇重，萬里客憑欄。一時花帶淚，樓高燕子寒", "萬里客憑欄，一時花帶淚。樓高燕子寒，日晚薔薇重"], "ans": 0, "exp": "律詩中間兩聯要對仗，且偶數句押韻（官、欄、寒、端）。(A)「一時花帶淚／萬里客憑欄」「日晚薔薇重／樓高燕子寒」兩聯都對仗，韻腳欄、寒正確。", "src": "會考第 7 題"}, {"stem": "「枝頭夜綻紫薇花，卻憶朝時抽綠芽。過客川流旋百代，心驚日去送生涯。」這是作者觀花有感的詩作，下列何者最能說明他的感受？", "opts": ["繁花似錦人獨飄零", "花前送別離情依依", "花開花落時光匆匆", "睹物思人倍感惆悵"], "ans": 2, "exp": "夜裡花開，卻想起早上才抽芽；「心驚日去送生涯」感嘆時光飛逝，即花開花落、時光匆匆。", "src": "會考第 8 題"}, {"stem": "袁枚〈遣興〉：「但肯尋詩便有詩，靈犀一點是吾師。夕陽芳草尋常物，解用都為絕妙詞。」下列何者與這首詩的主旨最接近？", "opts": ["太過尋常景物難成佳作", "寫詩為表達真正情感貴在真誠", "寫詩題材俯拾皆是，有心便能構成詩趣", "詩優劣全看詮釋功夫"], "ans": 2, "exp": "「夕陽芳草尋常物，解用都為絕妙詞」：平常景物只要用心體會，都能寫成好詩——寫詩題材俯拾皆是。", "src": "會考第 9 題"}, {"stem": "根據近體詩的格律，下列七言絕句的空格應填入哪些字？「玉樓天半起笙歌，風□宮嬪笑語和。月殿影開聞夜漏，水精簾捲近秋□。」", "opts": ["送，河", "迎，波", "拂，色", "向，月"], "ans": 0, "exp": "首句「樓」平→平起式，第二句第二字須仄：送、拂、向皆仄；韻腳歌、和屬同韻，末字須押韻→「河」。故選「送，河」。", "src": "會考第 10 題"}, {"stem": "張生以平聲韻習作七言絕句一首，詩題〈臨別〉：「暮雨初晴月上軒，丹楓蕭瑟滿山院。憑欄無語痴相牽，百感中來不忍言。」關於這首詩的說明，下列何者錯誤？", "opts": ["前兩句寫黃昏入夜秋景", "後兩句抒情，表達久別重逢心情", "第二句末字改為「園」才合律", "第三句末字不須押韻改「對」即可合律"], "ans": 1, "exp": "詩題〈臨別〉，內容寫離別在即的不捨，不是久別重逢。(C)「院」為仄聲，改「園」才押平聲韻；(D)第三句不押韻，「牽」改仄聲「對」即合律。", "src": "會考第 11 題"}, {"stem": "下列各選項「」中的詩句所表達的心情，何者說明不正確？", "opts": ["打起黃鶯兒，莫教枝上啼。「啼時驚妾夢，不得到遼西。」／開朗", "向晚意不適，驅車登古原。「夕陽無限好，只是近黃昏。」／惆悵", "「久旱逢甘雨，他鄉遇故知。」洞房花燭夜，金榜題名時。／驚喜", "昔有吳起者，母歿喪不臨。「嗟哉斯徒輩，其心不如禽。」／鄙斥"], "ans": 0, "exp": "「啼時驚妾夢，不得到遼西」：黃鶯啼叫驚醒夢中與遠方丈夫相會的妻子，心情是怨懟、思念，不是開朗。", "src": "會考第 12 題"}, {"stem": "「吹面不寒楊柳風」和以下哪個成語所描述的情境最相近？", "opts": ["春風滿面", "春風化雨", "春風和暢", "春寒料峭"], "ans": 2, "exp": "「吹面不寒楊柳風」寫春風溫和舒暢，與「春風和暢」最相近。(B)春風化雨指教育；(D)春寒料峭指初春寒冷。", "src": "會考第 13 題"}, {"stem": "「種豆南山下，草盛豆苗稀。晨興理荒穢，帶月荷鋤歸。道狹草木長，夕露沾我衣。衣沾不足惜，但使願無違。」若不論創作年代，如何從結構判斷它不是「五言律詩」？", "opts": ["句數太多", "偶數句沒有押韻", "第二聯及第三聯均無對仗", "不合起承轉合"], "ans": 2, "exp": "這是陶淵明〈歸園田居〉。它也是八句、偶句押韻，但律詩頷聯、頸聯必須對仗，這首第二、三聯都沒有對仗。", "src": "會考第 14 題"}, {"stem": "「回憶當年我養兒，我兒今又養孫兒，我兒餓我由他餓，莫教孫兒餓我兒。」（佛光詩語）詩中「父、子、孫」三人，正在挨餓的是誰？", "opts": ["父", "子", "孫", "父、子"], "ans": 3, "exp": "「我兒餓我由他餓」：兒子讓我（父）挨餓；「莫教孫兒餓我兒」：別讓孫子讓我兒挨餓——實際上父、子兩代都正在挨餓（孫子被養得好好的）。", "src": "會考第 15 題"}, {"stem": "下列文句皆是史記中對歷史人物的論贊，何者並未透露出正面讚許的意味？", "opts": ["評藺相如：一奮其氣，威信敵國，退而讓頗，名重泰山", "評韓信：假令韓信學道謙讓，不伐己功，不矜其能，則庶幾哉", "評李廣：及死之日，天下知與不知，皆為盡哀。彼其忠實心誠信於士大夫也", "評曹參：為漢相國，清靜極言合道。然百姓離秦之酷後，參與休息無為，故天下俱稱其美"], "ans": 1, "exp": "評韓信用假設語氣「假令……則庶幾哉」，表示若能謙讓就好了，帶有惋惜與批評；其他三人都是正面讚許。", "src": "會考第 16 題"}]}, {"id": "e2", "title": "作家・名著・題組", "items": [{"stem": "辛棄疾〈清平樂〉：「茅簷低小，溪上青青草。醉裡吳音相媚好，白髮誰家翁媼？大兒鋤豆溪東，中兒正織雞籠，最喜小兒亡賴，溪頭臥剝蓮蓬。」有關這闋詞的內容安排，次序為何？", "opts": ["先寫空間再寫時間", "先寫景物再寫人情", "先寫遠景再寫近景", "先寫事理再寫感想"], "ans": 1, "exp": "前四句先寫茅簷、溪草等景物，再寫翁媼與三個兒子的生活，是先寫景物再寫人情。", "src": "會考第 17 題"}, {"stem": "「曹雪芹的曾祖母孫氏擔任康熙保母，孫氏之夫曹璽於康熙二年被委任為江寧織造，此乃清廷財政重要職務，本規定三年更換一次，曹璽竟任職二十二年。又因曹璽之子曹寅自小即為康熙伴讀，成為康熙心腹，所以曹氏家族世襲江寧織造，共達五十八年。康熙六下江南，五度入住織造府。直到雍正即位，以曹家虧空公款為由，前後兩次抄家，終於令曹家敗落下來。」根據本文，下列何者在文中不曾被提及？", "opts": ["曹家得勢的緣由", "曹寅的身世與崛起", "兩任皇帝對曹家的態度", "曹雪芹世襲官職的經歷"], "ans": 3, "exp": "文中提到曹家得勢緣由、曹寅成為康熙心腹、康熙與雍正的不同態度；沒有提到曹雪芹世襲官職。", "src": "會考第 18 題"}, {"stem": "朱熹云：「程子曰：『大學，孔氏之遺書，而初學入德之門也。』於今可見古人為學次第者，獨賴此篇之存，而論、孟次之。學者必由是而學焉，則庶乎其不差矣。」根據這段文字，下列何者最接近朱熹的看法？", "opts": ["大學成書早於論孟", "大學內容較論孟深奧", "論孟思想以大學為本", "欲知古人為學修德次第，首推大學，其次論孟"], "ans": 3, "exp": "「可見古人為學次第者，獨賴此篇之存，而論、孟次之」：要了解古人為學修德的次第，首推大學，其次論孟。", "src": "會考第 19 題"}, {"stem": "「唐宋以來作桃源行，最傳者王摩詰（王維）、韓退之（韓愈）、王介甫（王安石）三篇。觀退之、介甫二詩，筆力意思甚可喜。及讀摩詰詩，多少自在！二公便如努力挽強（拉開強弓），不免面赤耳熱，此盛唐所以高不可及。」下列敘述何者不符合作者的觀點？", "opts": ["三篇皆世所稱頌", "退之介甫有刻意經營痕跡", "摩詰境界高於退之介甫", "論者為唐宋桃源行優劣爭得面赤耳熱"], "ans": 3, "exp": "「面赤耳熱」是比喻韓愈、王安石寫詩用力太過，並非論者爭論得面紅耳赤。", "src": "會考第 20 題"}, {"stem": "「先生曾主持文學發展基金會，致力於散文研究多年，蒐集、整理名家作品與生平資料，並在雜誌撰寫相關文學評論。近年從事散文創作，內容取材自現代都市生活現象，以剖析現代人的存在問題。」根據上述資料判斷，下列何者最不可能是這位作家的著作？", "opts": ["都會雜思與隨筆", "現代詩精選評析", "陳之藩作品導讀", "臺灣當代名家文選"], "ans": 1, "exp": "這位作家研究散文、創作散文，選項中只有「現代詩精選評析」與散文無關。", "src": "會考第 21 題"}, {"stem": "國文老師抽出史記、世說新語、儒林外史、稼軒長短句四本書，若要依照成書年代先後放回書架，下列排序何者正確？", "opts": ["史記→儒林外史→世說新語→稼軒長短句", "史記→世說新語→稼軒長短句→儒林外史", "世說新語→史記→儒林外史→稼軒長短句", "世說新語→稼軒長短句→史記→儒林外史"], "ans": 1, "exp": "史記（西漢）→世說新語（南朝宋）→稼軒長短句（南宋辛棄疾）→儒林外史（清）。", "src": "會考第 22 題"}, {"stem": "某博物館舉辦北宋文人展覽，模擬重建蘇軾的書房，不料工作人員把一本南宋之後才完成的作品放了上去。這本書應是下列何者？", "opts": ["說文解字", "三國演義", "杜工部集", "世說新語"], "ans": 1, "exp": "三國演義是元末明初羅貫中的作品，北宋時尚未出現；其他三者都早於北宋或在北宋前已完成。", "src": "會考第 23 題"}, {"stem": "唐玄宗與楊貴妃的愛情故事傳誦不絕，下列哪一部著作中最可能找到相關記載？", "opts": ["西遊記", "三國演義", "世說新語", "唐詩三百首"], "ans": 3, "exp": "唐玄宗、楊貴妃是唐代人物，唐詩（如白居易〈長恨歌〉）有相關描寫；西遊記、三國演義、世說新語都不寫此事。", "src": "會考第 24 題"}, {"stem": "宋史載：「軾以書見歐陽脩，脩語梅聖俞曰：『吾當避此人出一頭地。』」句中的「此人」指的是誰？", "opts": ["宋史作者", "蘇軾", "歐陽脩", "梅聖俞"], "ans": 1, "exp": "「軾以書見歐陽脩」：蘇軾帶著文章去見歐陽脩，歐陽脩說要讓「此人」出人頭地——指蘇軾。", "src": "會考第 25 題"}, {"stem": "阿明某日誤闖時光隧道回到元朝，下列哪一本書是他最不可能看到的？", "opts": ["史記", "片玉詞", "杜工部集", "三國演義"], "ans": 3, "exp": "三國演義是元末明初的作品，元朝時尚未完成；史記、片玉詞（北宋）、杜工部集（唐）元朝已有。", "src": "會考第 26 題"}, {"stem": "余光中〈大江東去〉：「大江東去，浪濤騰躍成千古／太陽昇火，月亮沉珠／那一波是捉月人？／那一波是溺水的大夫？／赤壁下，人弔髯蘇猶似髯蘇在弔古」這首新詩中提到的人物有哪些？", "opts": ["嫦娥屈原曹操", "嫦娥杜甫蘇軾", "李白杜甫曹操", "李白屈原蘇軾"], "ans": 3, "exp": "捉月人＝李白（傳說醉後捉月溺死）；溺水的大夫＝屈原（三閭大夫投汨羅江）；髯蘇＝蘇軾（赤壁）。", "src": "會考第 27 題"}, {"stem": "關於這兩首詩的內容，下列敘述何者正確？", "opts": ["甲晚上乙清晨", "甲送別地點在扶桑，乙在揚子江", "甲作者與友同行，乙送友獨往", "甲友以船為交通工具，乙友亦如此"], "ans": 3, "exp": "甲「一船明月一帆風」、乙「渡江人」，兩位友人都搭船。甲有「明月」，乙「離亭晚」是傍晚，所以(A)錯。", "src": "會考第 28 題", "box": ["甲：韋莊〈送日本國僧敬龍歸〉「扶桑已在渺茫中，家在扶桑東更東。此去與師誰共到？一船明月一帆風。」乙：鄭谷〈淮上與友人別〉「揚子江頭楊柳春，楊花愁殺渡江人。數聲風笛離亭晚，君向瀟湘我向秦。」(扶桑：東海神木，日出之地，亦日本別名)"]}, {"stem": "關於這兩首詩的寫作手法，下列敘述何者正確？", "opts": ["皆遲至末句才點出目的地", "各自重複某些字詞增節奏感", "甲由眼前景寫到想像景，乙相反", "甲只二四句用韻，乙一二四句皆用韻"], "ans": 1, "exp": "甲重複「扶桑」「一」，乙重複「楊」「向」，以重複字詞增加節奏感。", "src": "會考第 29 題", "box": ["甲：韋莊〈送日本國僧敬龍歸〉「扶桑已在渺茫中，家在扶桑東更東。此去與師誰共到？一船明月一帆風。」乙：鄭谷〈淮上與友人別〉「揚子江頭楊柳春，楊花愁殺渡江人。數聲風笛離亭晚，君向瀟湘我向秦。」(扶桑：東海神木，日出之地，亦日本別名)"]}, {"stem": "以上詩中抒發了作者什麼情緒？", "opts": ["思念故國的愁緒", "壯志難酬的慨嘆", "年老力衰的無奈", "同袍離散的遺憾"], "ans": 1, "exp": "作者曾參與抗日義軍保臺，「孤臣無力可回天」，抒發壯志難酬的慨嘆。", "src": "會考第 30 題", "box": ["丘逢甲〈有感書贈義軍舊書記〉「拜將壇高卑義旗，五洲矚目屬雄師。當時力保危臺意，只有軍前壯士知。宰相有權能割地，孤臣無力可回天。啼鵑喚起東都夢，沉鬱風雲已五年。」"]}, {"stem": "下列詞語何者指的是作者本人？", "opts": ["五洲", "壯士", "孤臣", "啼鵑"], "ans": 2, "exp": "「孤臣無力可回天」：作者自稱孤臣，無力挽回割臺的局勢。", "src": "會考第 31 題", "box": ["丘逢甲〈有感書贈義軍舊書記〉「拜將壇高卑義旗，五洲矚目屬雄師。當時力保危臺意，只有軍前壯士知。宰相有權能割地，孤臣無力可回天。啼鵑喚起東都夢，沉鬱風雲已五年。」"]}]}]}</script>
