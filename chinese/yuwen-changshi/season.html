<script type="application/json" id="bank">{"id": "season", "title": "詩詞中的季節", "eyebrow": "語文常識 · 單元 1", "intro": "從景物、時令、節氣、節日判斷詩詞描寫的季節。", "sections": [{"id": "poem", "title": "詩句判斷季節", "items": [{"stem": "「清明時節雨紛紛，路上行人欲斷魂。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 0, "exp": "杜牧〈清明〉：關鍵詞「清明」→春。", "src": "杜牧〈清明〉"}, {"stem": "「寒蟬淒切，對長亭晚，驟雨初歇。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 2, "exp": "柳永〈雨霖鈴〉：關鍵詞「寒蟬」→秋。", "src": "柳永〈雨霖鈴〉"}, {"stem": "「四月南風大麥黃，棗花未落桐陰長。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 1, "exp": "李頎〈送陳章甫〉：關鍵詞「四月、南風、大麥黃」→夏。", "src": "李頎〈送陳章甫〉"}, {"stem": "「一從梅粉褪殘妝，塗抹新紅上海棠。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 0, "exp": "王淇〈春暮遊小園〉：關鍵詞「海棠」→春。", "src": "王淇〈春暮遊小園〉"}, {"stem": "「顛狂柳絮隨風舞，輕薄桃花逐水流。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 0, "exp": "謝枋得〈慶全庵桃花〉：關鍵詞「柳絮、桃花」→春。", "src": "謝枋得〈慶全庵桃花〉"}, {"stem": "「沾衣欲溼杏花雨，吹面不寒楊柳風。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 0, "exp": "志南〈絕句〉：關鍵詞「杏花、楊柳」→春。", "src": "志南〈絕句〉"}, {"stem": "「欲將輕騎逐，大雪滿弓刀。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 3, "exp": "盧綸〈塞下曲〉：關鍵詞「大雪」→冬。", "src": "盧綸〈塞下曲〉"}, {"stem": "「月落烏啼霜滿天，江楓漁火對愁眠。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 2, "exp": "張繼〈楓橋夜泊〉：關鍵詞「霜、江楓」→秋。", "src": "張繼〈楓橋夜泊〉"}, {"stem": "「朔氣傳金柝，寒光照鐵衣。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 3, "exp": "〈木蘭詩〉：關鍵詞「朔氣」→冬。", "src": "〈木蘭詩〉"}, {"stem": "「殘花醞釀蜂兒蜜，細雨調和燕子泥。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 0, "exp": "胡祗遹〈陽春曲〉：關鍵詞「殘花、燕子泥」→春。", "src": "胡祗遹〈陽春曲〉"}, {"stem": "「金風玉露一相逢，便勝卻人間無數。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 2, "exp": "秦觀〈鵲橋仙〉：關鍵詞「金風玉露（七夕）」→秋。", "src": "秦觀〈鵲橋仙〉"}, {"stem": "「百畝中庭半是苔，桃花淨盡菜花開。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 0, "exp": "劉禹錫〈再遊玄都觀〉：關鍵詞「桃花、菜花」→春。", "src": "劉禹錫〈再遊玄都觀〉"}, {"stem": "「五月榴花照眼明，枝間時見子初成。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 1, "exp": "朱熹〈題榴花〉：關鍵詞「五月榴花」→夏。", "src": "朱熹〈題榴花〉"}, {"stem": "「明月照積雪，北風勁且哀。」所描寫的季節是？", "opts": ["春", "夏", "秋", "冬"], "ans": 3, "exp": "謝靈運〈歲暮〉：關鍵詞「積雪、北風」→冬。", "src": "謝靈運
